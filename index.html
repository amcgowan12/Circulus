  <section class="how"><div><h2>How each lesson works</h2><ol><li><b>Watch.</b> Plots update live; the model starts already at steady state.</li><li><b>Adjust.</b> A few sliders that matter for the topic; every other parameter sits under “All model parameters”.</li><li><b>Experiment.</b> The PV loop lab lets you edit every variable, type exact values and see the loop change, with the previous loop kept as a ghost.</li><li><b>Compare.</b> “Try this” buttons save the current loop in grey, then make one change so you see before and after.</li></ol></div>
  <div><h2>What the model is</h2><p>Blood flow through vessels behaves like current through a circuit: pressure is voltage, resistance is resistance, vessel compliance is capacitance. Each chamber is a capacitor whose stiffness rises and falls with every beat (time-varying elastance), and valves are one-way orifices whose pressure drop follows the Bernoulli relation. Solving the resulting differential equations 4,000 times per simulated second gives the waveforms you see.</p><details class="circd"><summary>Show the electrical circuit</summary><figure class="circuit">${CIRCUIT_SVG}<figcaption>Four time-varying elastance chambers, Bernoulli valves, a three-element systemic and pulmonary vasculature, a pericardium, septal shunts and pump ports.</figcaption></figure></details><p>Beyond the basic circuit, Circulus adds septal shunts, stenotic and leaky valves, a pericardium with effusion and constriction, breathing (spontaneous and positive-pressure), beat-to-beat contractility (restitution and post-extrasystolic potentiation), coronary supply–demand with ischaemic feedback, myocardial O₂ cost from the pressure–volume area, drugs, Impella and V-A ECMO.</p></div></section>
  <section class="map"><h2>All lessons</h2><div class="groups">${GROUPS_NAV.map(g => `<div class="grp"><h3>${esc(g[0])}</h3>${g[1].map(id => { const s = SECTIONS.find(x => x.id === id); return s ? `<a href="#${id}">${esc(s.t)}</a>` : ''; }).join('')}</div>`).join('')}</div></section>
  <p class="fine">Circulus is a teaching model, not a clinical tool. The baroreflex is off unless you switch it on, so when you change one thing the body does not compensate unless you change other parameters too. Values are for a typical adult (BSA 1.9 m²).</p>
  </article>`;
}
function bindHome() { if (!HOME_SIM) cmScenario(HOME_SCEN); else { document.querySelectorAll('[data-scen]').forEach(b => b.classList.toggle('on', b.dataset.scen === HOME_SCEN)); cmUpdate(); } }

// ---------- events
document.addEventListener('input', e => {
  const t = e.target; if (!HOME_SIM || !HOME_BASE || (t.id !== 'cmsvr' && t.id !== 'cmvol')) return;
  if (t.id === 'cmsvr') HOME_SIM.set('Ras', HOME_BASE.Ras * Math.pow(2.5, +t.value));
  else HOME_SIM.set('dV', HOME_BASE.dV + +t.value);
  cmSlLabels();
});
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset || !t.dataset.k || t.type !== 'range') return;
  const c = (t.dataset.g ? GCTL : CTL)[t.dataset.k];
  applyCtl(t.dataset.k, !!t.dataset.g, +t.value / c[5]);
});
document.addEventListener('input', e => {
  const t = e.target; if (!t.classList || !t.classList.contains('bpin')) return;
  const kb = t.dataset.b, opt = BF.find(f => f[0] === kb)[6], x = parseFloat(t.value);
  if (opt && t.value.trim() === '') S.bv[kb] = ''; else if (!isFinite(x)) return; else S.bv[kb] = x;
  if (kb === 'CI') v0SVe();
  if (kb === 'HR' && S.bv.SVe) { S.bv.CI = +(S.bv.SVe * S.bv.HR / 1000 / S.bv.BSAe).toFixed(2); const ci = document.querySelector('.bpin[data-b="CI"]'); if (ci) ci.value = S.bv.CI; }
  deriveB();
  const k = S.bv.mode, el = document.querySelector(`.bpin[data-b="${k}"]`); if (el) el.value = S.bv[k];
});
document.addEventListener('change', e => {
  const t = e.target; if (!t.classList || !t.classList.contains('num')) return;
  const g = !!t.dataset.g, k = t.dataset.k, c = (g ? GCTL : CTL)[k], x = parseFloat(t.value);
  if (!isFinite(x)) { syncCtl(k, g); return; }
  applyCtl(k, g, x / c[5]); t.value = +((g ? G[k] : sim.p[k]) * c[5]).toFixed(c[6]);
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('num')) e.target.blur(); });
// PV loop landmarks: click a marker to expand, click elsewhere on the plot to close
const pvHit = e => { const t = e.target; if (!t || t.id !== 'cv0' || !sec || sec.kind !== 'lab' || !S.labView || !S.labView.ann || !S.pvMarks) return undefined;
  const r = t.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top; let best = null, bd = 18;
  S.pvMarks.forEach(m => { const d = Math.hypot(m.x - x, m.y - y); if (d < bd) { bd = d; best = m.k; } }); return best; };
document.addEventListener('click', e => { const k = pvHit(e); if (k === undefined) return; S.labView.open = k && S.labView.open !== k ? k : null; syncPvann(); });
document.addEventListener('mousemove', e => { if (e.target && e.target.id === 'cv0') e.target.style.cursor = pvHit(e) ? 'pointer' : ''; });
document.addEventListener('click', e => {
  const t = e.target.closest('button, a'); if (!t) return;
  if (t.dataset.mode) { setMode(t.dataset.mode === 'adv'); return; }
  if (t.dataset.scen) { cmScenario(t.dataset.scen); return; }
  if (t.dataset.lv) { S.labView.view = t.dataset.lv; const c = t.dataset.lv === 'circ';
    $('#pvwrap').hidden = c; $('#circwrap').hidden = !c; document.querySelectorAll('[data-lv]').forEach(b => { const on = b.dataset.lv === t.dataset.lv; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    if (c) { cmOff = {}; cmUpdate(sim, true); } S.dirty = true; return; }
  if (t.id === 'cmlab') { PENDING_PRESET = HOME_SCEN; return; }
  if (t.dataset.v !== undefined && t.dataset.k) { applyCtl(t.dataset.k, !!t.dataset.g, +t.dataset.v); updateRO(); return; }
  if (t.dataset.tab !== undefined) { S.tab = +t.dataset.tab; renderLabTab(); return; }
  if (t.dataset.lt) { const k = t.dataset.lt; S.labView[k] = !S.labView[k]; t.classList.toggle('on', !!S.labView[k]); t.setAttribute('aria-pressed', !!S.labView[k]); if (k === 'ann') { S.labView.open = null; syncPvann(); } return; }
  if (t.dataset.pvk) { const k = t.dataset.pvk; S.labView.open = S.labView.open === k ? null : k; syncPvann(); return; }

  if (t.dataset.unpin !== undefined) { S.pins.splice(+t.dataset.unpin, 1); renderPins(); return; }
  if (t.dataset.reset) { const k = t.dataset.reset; applyCtl(k, false, S.base[k]); return; }
  if (t.dataset.bmode) { S.bv.mode = t.dataset.bmode; deriveB(); renderLabTab(); return; }
  if (t.dataset.bq !== undefined) { const q = BQUICK[+t.dataset.bq][1]; BOPT.forEach(k => S.bv[k] = ''); Object.assign(S.bv, q); S.echo = null; S.echoSet = null; S.echoInfo = null; S.bv.SVe = null; S.bpnote = ''; if (S.bv.mode === 'MAP') S.bv.mode = 'SVR'; deriveB(); renderLabTab(); return; }
  if (t.id === 'bpbuild') { buildPatient(); return; }
  if (t.id === 'bppaste') { pasteBedside(); return; }
  if (t.id === 'bpcompare') { compareStrats(); return; }
  if (t.dataset.apply !== undefined) { applyStrat(+t.dataset.apply); return; }
  if (t.id === 'labreset') { pinLoop('Before reset'); loadLabPreset(S.presetName); return; }
  if (t.dataset.a) { ACT[t.dataset.a][1](sim); return; }
  if (t.dataset.t !== undefined && sec) {
    const tr = sec.tries[+t.dataset.t];
    if (sim && tr.pin !== false) pinLoop('Before: ' + tr.l);
    if (tr.curve) pinCurve();
    if (tr.reset && sim) { sim = new Sim(Object.assign({}, sec.preset || {})); sim.run(sec.settle || 12); }
    if (sec.kind === 'lab') S.lastEdit = performance.now();
    if (sim && !tr.keep) {
      const base = sec.kind === 'lab' ? S.base : Object.assign({}, DEFAULTS, sec.preset || {});
      const target = Object.assign({}, base, tr.set || {});
      if (tr.mul) for (const k in tr.mul) target[k] = base[k] * tr.mul[k];
      if (tr.add) for (const k in tr.add) target[k] = base[k] + tr.add[k];
      for (const k in target) if (sim.p[k] !== target[k]) setP(k, target[k]);
    } else if (tr.set) for (const k in tr.set) setP(k, tr.set[k]);
    if (sec.kind === 'gas' || tr.gset) {
      G = Object.assign({}, GDEF, sec.gpreset || {}, tr.gset || {});
      for (const k in GCTL) syncCtl(k, true); S.dirty = true; updateRO();
    }
    if (tr.act) ACT[tr.act][1](sim);
    const n = $('#note'); n.hidden = false; n.innerHTML = '<b>Watch for:</b> ' + tr.w;
    return;
  }
  if (t.id === 'newcase') { newCase(); $('#score').textContent = scoreText(); return; }
  if (t.classList.contains('dx')) {
    const i = +t.dataset.i, ok = i === S.case, f = $('#qfb');
    if (!S.answered) { S.score = S.score || [0, 0]; S.score[1]++; if (ok) S.score[0]++; S.answered = true; }
    document.querySelectorAll('.dx').forEach(b => b.classList.toggle('right', +b.dataset.i === S.case));
    if (!ok) t.classList.add('wrong');
    f.hidden = false; f.innerHTML = `<b>${ok ? 'Correct' : 'Not quite'}: ${esc(CASES[S.case].n)}.</b> ${esc(CASES[S.case].why)}`;
    $('#score').textContent = scoreText(); return;
  }
  if (t.classList.contains('iv')) { const iv = INTERV[+t.dataset.i][1]; for (const k in iv) { const v = k === 'dV' ? sim.p.dV + iv[k] : iv[k]; sim.set(k, v); } const f = $('#qfb'); f.hidden = false; f.innerHTML = '<b>Given:</b> ' + esc(INTERV[+t.dataset.i][0]) + '. Watch the monitor respond over the next few beats.'; return; }
  if (t.id === 'play') { running = !running; t.textContent = running ? 'Pause' : 'Play'; t.setAttribute('aria-pressed', !running); return; }
  if (t.id === 'settle' && sim) { sim.run(10); return; }
  if (t.id === 'resetsec' && sec) { render(sec.id); return; }
  if (t.id === 'menu') { document.body.classList.toggle('navopen'); return; }
  if (t.id === 'navclose') { document.body.classList.remove('navopen'); return; }
  if (t.closest('#nav') && t.tagName === 'A') document.body.classList.remove('navopen');
});
document.addEventListener('change', e => { if (e.target.id === 'labpreset') { pinLoop('Preset: ' + S.presetName); loadLabPreset(e.target.value); return; } if (e.target.id === 'speed') speed = +e.target.value; if (e.target.id === 'navsel') location.hash = e.target.value; });
document.addEventListener('keydown', e => { if (e.key === ' ' && e.target === document.body) { e.preventDefault(); $('#play').click(); } });
$('#q').addEventListener('input', e => { const q = e.target.value.toLowerCase(); document.querySelectorAll('#nav a').forEach(a => a.hidden = q && !a.textContent.toLowerCase().includes(q)); document.querySelectorAll('#nav .ng').forEach(g => g.hidden = q && ![...g.querySelectorAll('a')].some(a => !a.hidden)); });

// ---------- nav
const GROUPS_NAV = window.GROUPS_NAV;
$('#nav').insertAdjacentHTML('beforeend', `<a href="#" class="homelink">Overview and model</a>` + GROUPS_NAV.map(g => `<div class="ng"><h3>${esc(g[0])}</h3>${g[1].map(id => { const s = SECTIONS.find(x => x.id === id); return s ? `<a href="#${id}">${esc(s.t)}</a>` : ''; }).join('')}</div>`).join(''));
$('#navsel').innerHTML = `<option value="">Overview</option>` + GROUPS_NAV.map(g => `<optgroup label="${esc(g[0])}">${g[1].map(id => { const s = SECTIONS.find(x => x.id === id); return s ? `<option value="${id}">${esc(s.t)}</option>` : ''; }).join('')}</optgroup>`).join('');

// ---------- main loop
function frameLoop(ts) {
  const dt = Math.min(0.05, (ts - lastT) / 1000 || 0); lastT = ts;
  if (sim && running && sec) { const n = Math.round(dt * speed / 0.00025); for (let i = 0; i < n; i++) sim.step(0.00025); }
  if (!sec && HOME_SIM && document.getElementById('cm')) { cmFrame(dt); if (ts - roT > 300) { roT = ts; cmUpdate(); } }
  const labCirc = sec && sec.kind === 'lab' && S.labView && S.labView.view === 'circ' && sim;
  if (labCirc) { cmDraw(sim, dt); if (ts - (S.cmT || 0) > 300) { S.cmT = ts; cmUpdate(sim, true); } }
  if (sec) {
    const live = sec.kind !== 'gas';
    if (live || S.dirty) { sec.panels.forEach((p, i) => { const cv = document.getElementById('cv' + i); if (cv) { try { PANEL[p.type](p, cv); } catch (err) { console.error(err); } } }); S.dirty = false; }
    if (live && ts - roT > 300) { roT = ts; updateRO(); const t = $('#simt'); if (t && sim) t.textContent = sim.t.toFixed(1) + ' s'; }
  }
  requestAnimationFrame(frameLoop);
}
window.addEventListener('resize', () => { S.dirty = true; });
window.addEventListener('hashchange', () => render(location.hash.slice(1)));
setMode(ADV);
render(location.hash.slice(1));
requestAnimationFrame(frameLoop);
}

</script>
