<!DOCTYPE html>
<html lang="en">
<head><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#8a1023"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circulus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;600;700&family=Red+Hat+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/*
VOICE: clinical lab bench — precise, calm, physician-grade; few hues, fine detail.
IDEA: a physiology recorder: live traces on gridded panels, an instrument you drive.
PICTURE: the running model itself — Wiggers traces, PV loops, a bedside monitor — large in every lesson.
COLOUR and TYPE: arterial crimson band, venous blue support, oxygen orange accent; Red Hat Display + Red Hat Text.
LAYOUT: crimson top bar, lesson index on the left, plots left / controls right, readouts and teaching below.
*/
:root{color-scheme:light;
  --bg:#ffffff;--soft:#f6f4f2;--panel:#ffffff;--ink:#1b1d22;--muted:#5f6672;--line:#e3dfdb;--grid:#eef0f3;--axis:#a3a9b3;
  --brand:#8a1023;--brand2:#6b0b1a;--onbrand:#fff;
  --lv:#c8102e;--ao:#6e0d1f;--la:#d9730d;--rv:#1f5fbf;--pa:#6a3fb5;--ra:#0f8a9d;--peri:#2d7d46;--dev:#444b55;
  --espvr:#3b3f47;--edpvr:#7c8794;--swfill:rgba(200,16,46,.16);--pefill:rgba(217,115,13,.22);
  --warn:#c25e00;--ok:#2d7d46;--sat-n:#4d5fa8;--sat-e:#c8102e;--tint:#fbeef0;--tint2:#eef3fb}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;
  --bg:#0d1015;--soft:#11151c;--panel:#141922;--ink:#e8eaee;--muted:#9aa3b2;--line:#262d39;--grid:#1c2330;--axis:#4b5566;
  --brand:#7a0e1f;--brand2:#5d0a17;
  --lv:#ff5470;--ao:#f2a0ac;--la:#ffae4d;--rv:#6ea8ff;--pa:#b495ff;--ra:#45d0e0;--peri:#62d48a;--dev:#c6ccd6;
  --espvr:#c9ced8;--edpvr:#8b95a5;--swfill:rgba(255,84,112,.22);--pefill:rgba(255,174,77,.22);
  --warn:#ffae4d;--ok:#62d48a;--sat-n:#8fa2ff;--sat-e:#ff5470;--tint:#2a141a;--tint2:#141d2c}}
:root[data-theme=dark]{color-scheme:dark;
  --bg:#0d1015;--soft:#11151c;--panel:#141922;--ink:#e8eaee;--muted:#9aa3b2;--line:#262d39;--grid:#1c2330;--axis:#4b5566;
  --brand:#7a0e1f;--brand2:#5d0a17;
  --lv:#ff5470;--ao:#f2a0ac;--la:#ffae4d;--rv:#6ea8ff;--pa:#b495ff;--ra:#45d0e0;--peri:#62d48a;--dev:#c6ccd6;
  --espvr:#c9ced8;--edpvr:#8b95a5;--swfill:rgba(255,84,112,.22);--pefill:rgba(255,174,77,.22);
  --warn:#ffae4d;--ok:#62d48a;--sat-n:#8fa2ff;--sat-e:#ff5470;--tint:#2a141a;--tint2:#141d2c}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Red Hat Text",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,h4{font-family:"Red Hat Display",system-ui,sans-serif;line-height:1.1;margin:0}
a{color:inherit}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--la);outline-offset:2px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--onbrand);display:flex;align-items:center;gap:14px;padding:8px max(2vw,14px);min-height:58px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font:700 22px "Red Hat Display",system-ui,sans-serif;letter-spacing:.2px;margin-right:auto}
.brand svg{width:34px;height:34px}
.brand small{font:400 13px "Red Hat Text",system-ui,sans-serif;opacity:.8;margin-left:4px}
.tb{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tb button,.tb select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:8px;min-height:40px;padding:0 14px;cursor:pointer}
.tb select option{color:#111}
.tb button:hover{background:rgba(255,255,255,.22)}
#play{min-width:84px;font-weight:600;background:#fff;color:var(--brand)}
#simt{font-variant-numeric:tabular-nums;opacity:.85;font-size:14px;min-width:56px}
#menu,#navsel{display:none}
/* layout */
.app{display:grid;grid-template-columns:264px minmax(0,1fr)}
#nav{position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto;background:var(--soft);border-right:1px solid var(--line);padding:14px 12px 40px}
#nav input{width:100%;min-height:42px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--bg);font-size:16px;margin-bottom:10px}
#nav h3{font:600 12px "Red Hat Text",system-ui,sans-serif;color:var(--muted);margin:16px 8px 4px}
#nav a{display:block;text-decoration:none;padding:6px 10px;border-radius:7px;font-size:14.5px;line-height:1.3}
#nav a:hover{background:var(--grid)}
#nav a.on{background:var(--brand);color:#fff;font-weight:600}
#nav .homelink{font-weight:600}
main{padding:22px clamp(14px,2.4vw,34px) 60px}
/* lesson */
.lhead{max-width:1000px;margin-bottom:16px}
.crumb{margin:0 0 6px;color:var(--brand);font-weight:600;font-size:14px}
:root[data-theme=dark] .crumb{color:var(--lv)}
.lhead h1{font-size:clamp(28px,3.4vw,42px);font-weight:700;text-wrap:balance}
.lede{font-size:17px;max-width:72ch;margin:10px 0 0;color:var(--ink)}
.work{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;align-items:start}
.work:has(.ctrl[hidden]){grid-template-columns:minmax(0,1fr)}
.ctrl[hidden]{display:none}
.plots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(400px,100%),1fr));gap:14px}
.panel{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 10px 6px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.panel.wide{grid-column:1/-1}
.panel figcaption{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;font:600 14px "Red Hat Display",system-ui,sans-serif;padding:2px 4px 6px}
.lg{display:flex;flex-wrap:wrap;gap:2px 12px;font:500 12px "Red Hat Text",system-ui,sans-serif;color:var(--muted)}
.lg i{font-style:normal;display:inline-flex;align-items:center;gap:5px}
.lg i::before{content:"";width:14px;height:3px;border-radius:2px;background:var(--c)}
.lg.ph{flex-basis:100%}.lg.ph i::before{height:8px;width:10px}
.fig{position:relative;height:var(--h,300px)}
.fig canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.panel.mon{background:#05080b;border-color:#1b222b}
.panel.mon figcaption{color:#cfd6df}
.ctrl{position:sticky;top:72px;max-height:calc(100vh - 86px);overflow:auto;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px}
.ctrl h2{font-size:17px;margin-bottom:8px}
.ctl{padding:8px 0;border-bottom:1px solid var(--line)}
.cl{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ctl label{font-size:14px;font-weight:600}
.ctl output{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;font-size:14px}
.ctl output small{font-weight:400;color:var(--muted)}
.ctl input[type=range]{width:100%;accent-color:var(--brand);height:30px;margin:2px 0 0;cursor:pointer}
:root[data-theme=dark] .ctl input[type=range]{accent-color:var(--lv)}
.help{margin:0;font-size:12.5px;color:var(--muted);line-height:1.35}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:8px;min-height:38px;padding:0 12px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.act{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:9px;min-height:42px;padding:0 14px;cursor:pointer;font-weight:600;font-size:14px}
.act:hover{background:var(--brand2)}
.act.ghost{background:transparent;color:var(--ink);border-color:var(--line);font-weight:500}
.act.ghost:hover{background:var(--grid)}
.all{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.all summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center}
.all h4{font-size:13px;color:var(--muted);margin:14px 0 2px}
/* number boxes */
.nb{display:inline-flex;align-items:baseline;gap:4px;white-space:nowrap}
.num{width:92px;min-height:32px;border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:2px 6px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:16px}
.num:hover{border-color:var(--axis)}
.nb small{color:var(--muted);font-size:12px}
.lbl{font-size:14px;font-weight:600}
/* lab */
.labbar{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.lp{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.lp select{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px;font-size:15px}
.tgs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tl{font-size:13px;color:var(--muted);margin-right:2px}
.tg{border:1px solid var(--line);background:var(--bg);border-radius:8px;min-height:38px;padding:0 11px;cursor:pointer;font-size:14px}
.tg.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.changes{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:30px}
.cl2{font-size:14px;color:var(--muted)}
.chg{border:1px solid var(--lv);background:var(--tint);color:var(--ink);border-radius:20px;min-height:34px;padding:0 10px 0 12px;cursor:pointer;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.chg i{font-style:normal;color:var(--lv);font-weight:700;font-size:15px}
.ctrl.lab .tabs{margin:8px 0 6px}
.work[hidden]{display:none}
.work.labw{grid-template-columns:minmax(0,1fr) minmax(270px,330px);gap:14px 18px;align-items:start}
.lableft{position:sticky;top:calc(58px + var(--vbh) + 10px);display:grid;gap:10px;align-self:start;max-height:calc(100vh - 58px - var(--vbh) - 20px);overflow:auto;overscroll-behavior:contain}
.lbtop{display:grid;gap:8px}
.labw .panel .fig{height:clamp(260px,calc(100vh - 380px),560px)}
.work.labw>.ctrl{position:static;max-height:none;overflow:visible}
.labbar{padding:8px 10px;gap:8px 14px}
.ctrl.lab .labbar{background:var(--bg);margin-bottom:12px;padding:10px}
.ctrl.lab .lp{flex-wrap:wrap;width:100%}
.ctrl.lab .lp select{flex:1;min-width:0}
.labbar .tg{min-height:34px;padding:0 9px;font-size:13.5px}
.lp select{min-height:36px}
.mini{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tgtline{margin:0;font-size:13.5px;background:var(--tint2);border:1px solid var(--line);border-radius:9px;padding:6px 10px}
.tgtline.bad{background:var(--tint);color:var(--lv)}
.m{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:5px 9px;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 5px;min-height:44px}
.m span{flex-basis:100%;font-size:11.5px;color:var(--muted);line-height:1.2}
.m b{font:600 18px "Red Hat Display",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.m small{font-size:11px;color:var(--muted)}
.m.bad{background:var(--tint)}.m.bad b{color:var(--lv)}
.plots.below{margin-top:14px}
/* lab: hide the lesson list below 1400px to make room for loop + editor side by side */
@media (min-width:901px) and (max-width:1399px){
  body.labmode .app{grid-template-columns:minmax(0,1fr)}
  body.labmode #nav{position:fixed;top:58px;left:0;bottom:0;width:min(320px,88vw);z-index:30;transform:translateX(-105%);transition:transform .2s;height:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  body.labmode.navopen #nav{transform:none}
  body.labmode #menu{display:inline-flex;align-items:center}
  body.labmode #navclose{display:block!important}
}
@media (max-width:1399px){
  body.labmode .top{position:relative}
  body.labmode #nav{top:0;z-index:40}
  body.labmode .work.labw>.vbar{top:0}
  body.labmode .lableft{top:calc(var(--vbh) + 10px);max-height:calc(100vh - var(--vbh) - 20px)}
}
@media (max-width:1100px){.mini{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:760px){.mini{grid-template-columns:repeat(2,minmax(0,1fr))}.labw .panel .fig{height:clamp(240px,calc(100vh - 330px),460px)}}
@media (max-width:620px){
  .work.labw{grid-template-columns:minmax(0,1fr)}
  .lableft{display:contents;max-height:none}
  .labw>.lableft>.panel{position:sticky;top:var(--vbh);z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.12)}
  .work.labw>.vbar{top:0}
  .labw .panel .fig{height:min(300px,40vh)}
  .mini{grid-template-columns:repeat(4,minmax(0,1fr))}
  .m b{font-size:15px}
}
.ctrl.lab .tabs button{font-size:13px;min-height:34px;padding:0 9px}
/* vitals bar */
:root{--vbh:62px}
.vbar{display:flex;gap:2px;background:#0b0f14;border-radius:12px;padding:6px;overflow-x:auto;scrollbar-width:thin;margin:0 0 14px;height:var(--vbh)}
.v{flex:1 0 auto;min-width:84px;display:flex;flex-direction:column;justify-content:center;padding:2px 10px;border-radius:8px}
.v+.v{border-left:1px solid rgba(255,255,255,.08);border-radius:0}
.vl{font:600 11px "Red Hat Text",system-ui,sans-serif;color:var(--vc);opacity:.85;white-space:nowrap}
.vv{font:600 21px/1.05 "Red Hat Display",system-ui,sans-serif;color:var(--vc);font-variant-numeric:tabular-nums;white-space:nowrap}
.vu{font:500 10.5px "Red Hat Text",system-ui,sans-serif;color:rgba(255,255,255,.5);white-space:nowrap}
.v.bad{background:rgba(255,80,80,.14)}
.v.bad .vv{color:#ffd0d0}
.work.labw>.vbar{grid-column:1/-1;position:sticky;top:58px;z-index:6;margin:0;box-shadow:0 4px 14px rgba(0,0,0,.18)}
/* drug effects */
.fxv{margin:2px 0 0;font-size:12.5px;font-weight:600;color:var(--lv)}
.drugfx{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:0}
.lesson>.drugfx{margin-top:18px}
.fxw{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--lv);background:var(--tint);border-radius:8px;padding:6px 8px}
.fxnone{margin:0;font-size:13.5px;color:var(--muted)}
.fxh{margin:0 0 4px;font-weight:600;font-size:14px}
.fxh span{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
.fxt{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.fxt th{text-align:left;font-weight:500;padding:4px 6px 4px 0}
.fxt td{text-align:right;padding:4px 4px;white-space:nowrap}
.fxt tr+tr{border-top:1px solid var(--line)}
.fxt .ar{color:var(--muted)}
.fxt .up{color:var(--lv)}.fxt .dn{color:var(--rv)}
.fxt .u{color:var(--muted);font-size:12px;text-align:left}
/* builder */
.build .seg{align-items:center;margin:8px 0}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:8px 0}
.bf{display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:600}
.bf .nb input{flex:1;min-width:0;width:auto;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:2px 8px;text-align:right;font:600 16px "Red Hat Text",system-ui,sans-serif}
.bf .nb{display:flex;gap:4px;align-items:center}
.bf .nb small{flex:none;font-size:11.5px;color:var(--muted)}
.bgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.bf.calc input{background:var(--grid);color:var(--muted)}
.bq,.bapply{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 12px}
.bq .tg,.bapply .tg{min-height:34px;font-size:13px}
.bstat{font-size:13.5px;margin:8px 0 4px;min-height:1em}
.bstat .warn{color:var(--lv)}
.muted{color:var(--muted)}
.bh{font-size:16px;margin:16px 0 4px}
.stt{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.stt th,.stt td{padding:5px 6px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
.stt thead th{border-top:0;color:var(--muted);font-weight:600}
.stt tbody th{text-align:left;font-weight:600}
.stt tbody th small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.stt tr.cur{background:var(--grid)}
.stt td.good{color:var(--ok);font-weight:600}
.stt td.bad{color:var(--lv);font-weight:600}
.tg.sm{min-height:30px;font-size:12.5px;padding:0 8px}
/* saved loops */
.pins{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.pins .pl{color:var(--muted);font-size:13px}
.pin{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:0 2px 0 10px;min-height:32px}
.pin i{width:16px;height:0;border-top:2px dashed var(--pc)}
.pin button{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;width:28px;height:28px;border-radius:50%;cursor:pointer}
.pin button:hover{background:var(--tint);color:var(--lv)}
.ctrl .pins{margin-top:8px}
/* readouts */
.ro{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px;margin:18px 0}
.r{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;display:flex;flex-direction:column;gap:1px}
.rl{font-size:12.5px;color:var(--muted);line-height:1.25}
.rv{font:600 23px "Red Hat Display",system-ui,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.rv small{font:500 12px "Red Hat Text",system-ui,sans-serif;color:var(--muted);margin-left:4px}
.rv em{font-style:normal;font-size:13px;margin-left:5px}
.rn{font-size:11.5px;color:var(--muted)}
.r.bad{background:var(--tint)}
.r.bad .rv{color:var(--lv)}
/* learn */
.learn{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
.learn h2{font-size:20px;margin-bottom:6px}
.hint{margin:0 0 10px;color:var(--muted);font-size:14px}
.tries{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:10px}
.tbtn{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:48px}
.tbtn:hover{border-color:var(--lv);background:var(--tint)}
.tbtn b{font-size:15px}
.tbtn span{font-size:13px;color:var(--muted)}
.note{background:var(--tint2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0 0;font-size:15.5px}
.keys ul{margin:0;padding-left:20px}
.keys li{margin:6px 0}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.pn a{text-decoration:none;font-weight:600;padding:10px 0;color:var(--brand)}
:root[data-theme=dark] .pn a{color:var(--lv)}
/* quiz */
.quiz{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.qbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.qbar p{margin:0;font-weight:600}
#score{color:var(--muted);font-variant-numeric:tabular-nums}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.ol{font-weight:600;font-size:14px;color:var(--muted)}
.dx,.iv{border:1px solid var(--line);background:var(--panel);border-radius:9px;min-height:42px;padding:0 12px;cursor:pointer;font-size:14px}
.dx:hover,.iv:hover{border-color:var(--lv)}

.home{max-width:1240px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px;align-items:center;padding:10px 0 26px;border-bottom:1px solid var(--line)}

.circuit{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}

.how ol{padding-left:20px;margin:0}.how li{margin:8px 0}
.how p{margin:0 0 10px;max-width:70ch}
.map{padding:26px 0}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:18px 22px}
.grp h3{font-size:15px;color:var(--brand);margin-bottom:6px}
:root[data-theme=dark] .grp h3{color:var(--lv)}
.grp a{display:block;text-decoration:none;padding:5px 0;border-bottom:1px solid var(--line);font-size:15px}
.grp a:hover{color:var(--lv)}
.fine{color:var(--muted);font-size:14px;max-width:80ch}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}

  <a class="brand" href="#"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 6c-7 0-12 6-12 14s5 14 12 14" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><path d="M20 34c7 0 12-6 12-14S27 6 20 6" fill="none" stroke="#ffb3be" stroke-width="3.2" stroke-linecap="round"/><path d="M8 20h6l3-6 4 12 3-6h8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg>Circulus<small>cardiovascular physiology lab</small></a>
  <div class="tb">
    <div class="mode" role="group" aria-label="Detail level" title="Basic shows the core numbers; Advanced reveals every metric and setting"><button type="button" data-mode="basic" aria-pressed="true" class="on">Basic</button><button type="button" data-mode="adv" aria-pressed="false">Advanced</button></div>

  <main id="main"></main>

<script>
// ================= Circulus model engine =================
// Lumped electrical-analog model of the circulation.
// Chambers: time-varying elastance blended with exponential EDPVR.
// Valves: Bernoulli orifices (effective forward / regurgitant area, cm^2) + small linear R.
const DEFAULTS = {
  HR: 72, PRi: 0.16, rhythm: 0,          // rhythm 0 sinus, 1 AF
  // ventricles
  LV_Ees: 2.3, LV_V0: 5, LV_A: 0.34, LV_k: 0.027, LV_tau: 0.035,
  RV_Ees: 0.6, RV_V0: 10, RV_A: 0.3, RV_k: 0.027, RV_tau: 0.035,
  // atria
  LA_Ees: 0.42, LA_V0: 5, LA_A: 0.45, LA_k: 0.058,
  RA_Ees: 0.32, RA_V0: 5, RA_A: 0.55, RA_k: 0.056,
  // systemic
  Rcs: 0.035, Ras: 0.93, Cas: 1.4, Csv: 70, Rvs: 0.035, V0sa: 600, V0sv: 2950,
  // pulmonary
  Rcp: 0.012, Rap: 0.07, Cap: 4.5, Cpv: 9, Rvp: 0.008, V0pa: 100, V0pv: 330,
  dV: 0,                                  // volume status relative to normal (mL)
  // valves (effective orifice areas, cm^2)
  av_f: 3.5, av_r: 0, mv_f: 5, mv_r: 0, tv_f: 6, tv_r: 0, pv_f: 3.5, pv_r: 0,
  asd: 0, vsd: 0,                         // shunt orifice areas cm^2
  // pericardium
  peri: 1, periV0: 340, periK: 0.03, periA: 1.0, eff: 0,
  // respiration 0 none, 1 spontaneous, 2 positive-pressure
  resp: 0, RRresp: 14, peep: 5, Pplat: 20,
  // devices
  imp: 0, ecmo: 0, rpump: 0,              // Impella level 0-9, VA-ECMO L/min, Impella RP level
  // drugs
  dobu: 0, milr: 0, ntg: 0, snp: 0, ne: 0, bb: 0, ino: 0, epi: 0, dopa: 0, vaso: 0, phenyl: 0, acei: 0, arni: 0, mido: 0,
  exer: 0,
  // coronary
  cadOn: 0, sten: 0,
  // oxygen
  VO2: 250, Hb: 14, SaO2: 0.98,
  ecgV: 1,                                // QRS voltage scale (low in infiltrative disease)
  baro: 0, baroSet: 95,                   // arterial baroreflex (off by default), MAP set point
  tCVP: 0, tCI: 0, tCIlever: 1,           // haemodynamic targets (0 = off); CI lever 0 HR, 1 contractility, 2 SVR
  tSI: 0, tSIlever: 0,                    // stroke index target; lever 0 preload (volume), 1 contractility, 2 SVR
  tMVO2: 0, tMVO2lever: 1,                // myocardial O2 target (mL/min); lever 0 HR, 1 contractility, 2 SVR
  tEF: 0, tEFlever: 0,
  tMAP: 0                                 // MAP target via SVR (used by the patient builder)
};
const VBASE = 5000; // reference total blood volume

function orifice(dP, Rl, Af, Ar) {
  if (dP >= 0) {
    if (Af <= 0) return 0;
    const b = 1 / ((50 * Af) ** 2);
    return 2 * dP / (Rl + Math.sqrt(Rl * Rl + 4 * b * dP));
  }
  if (Ar <= 0) return 0;
  const b = 1 / ((50 * Ar) ** 2), d = -dP;
  return -2 * d / (Rl + Math.sqrt(Rl * Rl + 4 * b * d));
}
function act(ts, Tmax, tau) {
  if (ts < 0) return 0;
  if (ts < Tmax) return 0.5 * (1 - Math.cos(Math.PI * ts / Tmax));
  const s = ts - Tmax, c = 0.8 * tau;
  return Math.exp(-(Math.sqrt(s * s + c * c) - c) / tau);
}
const cexp = x => Math.exp(x > 9 ? 9 : x);
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;

function effective(p) {
  const e = Object.assign({}, p);
  const x = p.exer;
  e.HR = p.HR + 92 * x;
  e.LV_Ees *= 1 + 1.2 * x; e.RV_Ees *= 1 + 1.7 * x; e.LA_Ees *= 1 + 0.6 * x; e.RA_Ees *= 1 + 0.6 * x;
  e.LV_tau *= 1 - 0.45 * x; e.RV_tau *= 1 - 0.45 * x;
  e.Ras *= 1 - 0.64 * (1 - (1 - x) ** 2); e.Rap *= 1 - 0.5 * x; e.V0sv -= 800 * x; e.Rvs *= 1 - 0.45 * x; e.Cas *= 1 - 0.3 * x;
  e.VO2 = p.VO2 + 1700 * x;
  // dobutamine mcg/kg/min
  const d = p.dobu;
  e.LV_Ees *= 1 + 0.045 * d; e.RV_Ees *= 1 + 0.045 * d; e.HR += 1.6 * d;
  e.Ras *= 1 - 0.012 * d; e.LV_tau *= 1 - 0.015 * d; e.RV_tau *= 1 - 0.015 * d; e.VO2 += 3 * d;
  // milrinone mcg/kg/min
  const m = p.milr;
  e.LV_Ees *= 1 + 0.55 * m; e.RV_Ees *= 1 + 0.55 * m; e.HR += 12 * m;
  e.Ras *= 1 - 0.5 * m; e.Rap *= 1 - 0.5 * m; e.V0sv += 250 * m;
  e.LV_tau *= 1 - 0.35 * m; e.RV_tau *= 1 - 0.35 * m;
  // nitroglycerin mcg/min
  const n = p.ntg;
  e.V0sv += 3.2 * n; e.Ras *= 1 - 0.0011 * n; e.Rap *= 1 - 0.0012 * n; e.V0pv += 0.3 * n;
  // nitroprusside mcg/kg/min
  const s = p.snp;
  e.Ras *= 1 - 0.16 * s; e.V0sv += 110 * s; e.Rap *= 1 - 0.1 * s; e.Cas *= 1 + 0.08 * s;
  // norepinephrine mcg/kg/min
  const ne = p.ne;
  e.Ras *= 1 + 2.4 * ne; e.LV_Ees *= 1 + 0.7 * ne; e.RV_Ees *= 1 + 0.7 * ne; e.HR += 12 * ne; e.V0sv -= 700 * ne;
  e.Rap *= 1 + 0.4 * ne;
  // epinephrine mcg/kg/min: beta1 + beta2 at low dose, alpha1 dominates at high dose
  const ep = p.epi;
  e.LV_Ees *= 1 + 1.6 * ep; e.RV_Ees *= 1 + 1.6 * ep; e.HR += 60 * ep; e.LV_tau *= 1 - 0.5 * Math.min(ep, 0.5); e.RV_tau *= 1 - 0.5 * Math.min(ep, 0.5);
  e.Ras *= 1 - 0.8 * ep + 3.2 * ep * ep; e.V0sv -= 600 * ep; e.Rap *= 1 + 0.2 * ep; e.VO2 += 200 * ep;
  // dopamine mcg/kg/min: dopaminergic (<3), beta1 (3-10), alpha1 (>10)
  const dp = p.dopa;
  e.LV_Ees *= 1 + 0.035 * Math.min(dp, 12); e.RV_Ees *= 1 + 0.035 * Math.min(dp, 12); e.HR += 1.8 * dp;
  e.Ras *= (1 - 0.03 * Math.min(dp, 3)) * (1 + 0.06 * Math.max(0, dp - 8)); e.V0sv -= 25 * Math.max(0, dp - 5);
  // vasopressin U/min: V1 vasoconstriction, no inotropy or chronotropy, relatively spares pulmonary bed
  const vp = p.vaso;
  e.Ras *= 1 + 12 * vp; e.V0sv -= 3000 * vp;
  // phenylephrine mcg/kg/min: pure alpha1
  const ph = p.phenyl;
  e.Ras *= 1 + 0.5 * ph; e.V0sv -= 150 * ph; e.Rap *= 1 + 0.15 * ph;
  // ACE inhibitor / ARB (fraction of target dose): arteriolar + mild venous dilation via angiotensin II blockade
  const ac = p.acei;
  e.Ras *= 1 - 0.2 * ac; e.V0sv += 150 * ac; e.Rap *= 1 - 0.05 * ac;
  // ARNI, sacubitril-valsartan (fraction of target dose): ARB plus neprilysin inhibition (natriuretic peptides: more venodilation)
  const an = p.arni;
  e.Ras *= 1 - 0.26 * an; e.V0sv += 280 * an; e.Rap *= 1 - 0.1 * an;
  // midodrine (mg per dose): oral alpha1 agonist (desglymidodrine)
  const md = p.mido;
  e.Ras *= 1 + 0.025 * md; e.V0sv -= 12 * md;
  // beta blocker (0-1)
  const bb = p.bb;
  e.HR *= 1 - 0.3 * bb; e.LV_Ees *= 1 - 0.18 * bb; e.RV_Ees *= 1 - 0.18 * bb;
  // inhaled pulmonary vasodilator (0-1)
  e.Rap *= 1 - 0.45 * p.ino;
  e.Ras = Math.max(e.Ras, 0.15); e.Rap = Math.max(e.Rap, 0.01);
  e.HR = clamp(e.HR, 25, 220);
  return e;
}

const SIG = ['LVP', 'AoP', 'LAP', 'RVP', 'PAP', 'RAP', 'LVV', 'RVV', 'LAV', 'RAV', 'Qmv', 'Qav', 'Qtv', 'Qpv', 'ECG', 'eV', 'Ppe', 'Pit', 'SAP', 'phase', 'Qimp', 'Qecmo', 'Qcor'];
const BUFN = 4000, SDT = 0.002; // 8 s at 2 ms

class Sim {
  constructor(params) {
    this.p = Object.assign({}, DEFAULTS, params || {});
    this.buf = {}; SIG.forEach(k => this.buf[k] = new Float32Array(BUFN));
    this.bt = new Float64Array(BUFN);
    this.reset();
  }
  set(k, v) {
    if (k === 'dV') { this.y[5] += v - this.p.dV; this.y[5] = Math.max(this.y[5], 10); }
    this.p[k] = v; this.refresh();
    if (k !== 'HR' && k !== 'dV' && k !== 'LV_Ees' && k !== 'Ras') { this.hrCeil = null; this.ciHist = []; this.tgH = {}; }
  }
  refresh() {
    const e = effective(this.p), x = this.p.baro ? this.bx || 0 : 0;
    if (x) {
      e.HR = clamp(e.HR * (1 + 0.45 * x), 25, 200);
      e.LV_Ees *= 1 + 0.25 * x; e.RV_Ees *= 1 + 0.25 * x;
      e.LV_tau *= 1 - 0.15 * x; e.RV_tau *= 1 - 0.15 * x;
      e.Ras *= 1 + 0.3 * x; e.V0sv -= 350 * x;
    }
    this.e = e;
  }
  setMany(o) { for (const k in o) this.set(k, o[k]); }
  reset() {
    this.bx = 0; this.refresh();
    const e = this.e;
    // initial guess, then scale venous to match total volume
    const y = [55, 110, 55, 125, e.V0sa + e.Cas * 92, 0, e.V0pa + e.Cap * 15, e.V0pv + e.Cpv * 8];
    this.effNow = e.eff;
    const room = e.periV0 + 30 - e.eff;
    if (e.peri && room < 345) { const f = Math.max(0.25, room / 345); for (let i = 0; i < 4; i++) y[i] *= f; }
    let other = 0; for (let i = 0; i < 8; i++) if (i !== 5) other += y[i];
    y[5] = Math.max(VBASE + this.p.dV - other, 50);
    this.y = y;
    this.t = 0; this.ns = 0; this.head = 0; this.count = 0;
    const RR = 60 / e.HR;
    this.nextA = 0.02; this.pendV = Infinity; this.pvcAt = Infinity; this.blockNext = false; this.pvcQ = false;
    this.nextAF = 0.2;
    this.tV = -10; this.tVp = -20; this.tA = -10; this.tAp = -20; this.vType = 0;
    this.bf = 1; this.pot = 0; this.isch = 0;
    this.occl = null;
    this.loop = { LV: [], RV: [], LA: [], RA: [] };
    this.lastLoop = { LV: [], RV: [], LA: [], RA: [] };
    this.loopHist = [];
    this.beats = [];
    this.b = null; this.acc = this.newAcc();
    this.respHist = [];
    this.vBeats = []; this.aBeats = [];
    this.rng = 12345;
    this.Q = {};
  }
  rand() { this.rng = (this.rng * 16807) % 2147483647; return this.rng / 2147483647; }
  totalVolume() { return this.y.reduce((a, b) => a + b, 0); }
  newAcc() {
    return { n: 0, T: 0, LVPmax: -1e9, LVPmin: 1e9, AoMax: -1e9, AoMin: 1e9, AoSum: 0, PAmax: -1e9, PAmin: 1e9, PASum: 0,

    { l: 'Give 500 mL', set: { dV: 500 }, w: 'EDV and EDP rise along the EDPVR; stroke volume rises while ESV barely moves (Frank–Starling).' },
    { l: 'Haemorrhage 700 mL', set: { dV: -700 }, w: 'The loop shrinks to the left; stroke volume and pressure fall at unchanged contractility.' },
    { l: 'Venodilate', set: { V0sv: 3350 }, w: 'No blood is lost, but more of it sits in compliant veins as unstressed volume, so the heart fills less. This is how nitrates and anaesthesia lower preload.' },
  ],
  keys: ['Preload ≈ EDV (or EDP read through the EDPVR).', 'Only stressed volume generates filling pressure; venous tone moves blood between stressed and unstressed pools.', 'At the steep end of the EDPVR, small volume gains cause large EDP rises.'] },

{ id: 'afterload', t: 'Afterload',
  lede: 'Afterload is the load the ventricle ejects against. It has a steady part (vascular resistance), a pulsatile part (arterial compliance) and the characteristic impedance of the aorta.',
  ctrls: ['Ras', 'Cas', 'Rcs'],
  panels: [pvLV({ ea: true }), wL()],
  ro: ['BP', 'MAP', 'PP', 'SV', 'ESP', 'LVESV', 'Ea', 'SVR'],
  tries: [
    { l: 'Double SVR', set: { Ras: 1.86 }, w: 'End-systolic pressure rises, the loop gets taller and narrower, and the Ea line steepens.' },
    { l: 'Stiffen the aorta', set: { Cas: 0.6 }, w: 'Pulse pressure widens: systolic rises and diastolic falls, with only a small change in mean pressure.' },
    { l: 'Vasodilate', set: { Ras: 0.5 }, w: 'Ejection is easier, end-systolic volume falls and stroke volume rises, at the cost of lower arterial pressure.' },
  ],
  keys: ['Effective arterial elastance Ea ≈ ESP ÷ SV lumps resistance, compliance and heart rate into one slope.', 'For a fixed ESPVR, higher afterload means higher end-systolic volume and lower stroke volume.', 'Arterial stiffness widens pulse pressure; resistance raises mean pressure.'] },

{ id: 'contractility', t: 'Contractility',
  lede: 'Contractility (inotropy) is the intrinsic strength of contraction at a given load, read here as the ESPVR slope Ees. It sets how far the ventricle can empty against a given pressure.',
  ctrls: ['LV_Ees', 'dobu'],
  panels: [pvLV(), wL()],
  ro: ['EF', 'SV', 'LVESV', 'LVEDV', 'LVEDP', 'ESP', 'dpmax', 'MAP'],
  tries: [
    { l: 'Strong heart (Ees 4)', set: { LV_Ees: 4 }, w: 'The ESPVR steepens; ESV falls, SV and dP/dt max rise.' },
    { l: 'Weak heart (Ees 1)', set: { LV_Ees: 1 }, w: 'ESV rises, SV falls and the heart sits on a lower loop. With no reflexes, pressure falls too.' },
    { l: 'Weak heart, then 600 mL', set: { LV_Ees: 1, dV: 600 }, w: 'Volume loading restores some stroke volume, but at a much higher filling pressure: the compensated failing heart.' },
  ],
  keys: ['Ees is relatively load-independent; EF and dP/dt max are load-dependent surrogates.', 'Lower contractility shifts the end-systolic point right and down.', 'Preload can partly compensate for weak contractility, at the price of congestion.'] },

{ id: 'lusitropy', t: 'Lusitropy',
  lede: 'Lusitropy is the speed of active relaxation, measured by τ, the time constant of isovolumic pressure decay. Slow relaxation lowers early filling and, at fast heart rates, leaves the ventricle stiff when the next beat begins.',
  ctrls: ['LV_tau', 'HR', 'dobu'],
  panels: [wL({ ymax: 130 }), pvLV(), wF({ sig: ['Qmv'], title: 'Mitral inflow', wide: true, h: 180 })],
  ro: ['tau', 'dpmin', 'LVEDP', 'LAP', 'Evel', 'EA', 'LVEDV', 'SV'],
  tries: [
    { l: 'Slow relaxation (τ 75 ms)', set: { LV_tau: 0.075 }, w: 'Pressure decays slowly after closure of the aortic valve, dP/dt min becomes less negative and the early E wave shrinks while the A wave grows.' },
    { l: 'Slow relaxation at 130 bpm', set: { LV_tau: 0.075, HR: 130 }, w: 'The next beat arrives before relaxation finishes. Diastolic pressure stays high and EDP rises: incomplete relaxation.' },
    { l: 'Dobutamine 10', set: { LV_tau: 0.075, dobu: 10 }, w: 'β-agonism speeds relaxation (positive lusitropy) and strengthens contraction.' },
  ],
  keys: ['Normal τ is roughly 30–40 ms; ischaemia, hypertrophy and age prolong it.', 'Relaxation is essentially complete after about 3.5 × τ.', 'Tachycardia plus slow relaxation is a recipe for raised filling pressures.'] },

{ id: 'starling-curves', t: 'Starling curves',
  lede: 'The Frank–Starling curve plots stroke volume against filling pressure. The model computes the whole curve for the current heart by running it to steady state at nine blood volumes.',
  ctrls: ['LV_Ees', 'Ras', 'dV'], acts: ['curve'],
  panels: [{ type: 'starling', title: 'Ventricular function curve (SV vs LVEDP)' }, pvLV()],
  ro: ['SV', 'LVEDP', 'CO', 'EF', 'MAP'],
  tries: [
    { l: 'Weaker heart (Ees 1)', set: { LV_Ees: 1 }, curve: true, w: 'The new curve is flatter and lower; the old curve is kept as a dashed reference.' },
    { l: 'Stronger heart (Ees 3.8)', set: { LV_Ees: 3.8 }, curve: true, w: 'The curve shifts up and to the left: more stroke volume at every filling pressure.' },
    { l: 'Raise SVR', set: { Ras: 1.8 }, curve: true, w: 'Afterload also lowers the curve, which is why vasodilators help a failing heart.' },
  ],
  keys: ['The curve is steep at low filling pressures and flattens as the EDPVR stiffens.', 'Inotropes and afterload reduction move the heart to a higher curve; fluid moves it along the same curve.', 'On the flat part, fluid raises pressure without raising output.'] },

{ id: 'exercise', t: 'Exercise',
  lede: 'Exercise drives heart rate, contractility and relaxation up, dilates muscle arterioles, constricts veins and activates the muscle pump. One slider bundles all of these.',
  ctrls: ['exer', 'bb'],
  panels: [pvLV(), wL(), wV({ wide: true, h: 170 })],
  ro: ['HR', 'BP', 'CO', 'SV', 'EF', 'LVEDV', 'LAP', 'VO2', 'SvO2'],
  tries: [
    { l: 'Moderate (50%)', set: { exer: 0.5 }, w: 'Cardiac output roughly doubles, mostly from heart rate; ESV falls as contractility rises.' },
    { l: 'Peak (100%)', set: { exer: 1 }, w: 'Output approaches three times rest. Systolic pressure rises, diastolic pressure falls as SVR drops, and SvO₂ falls as extraction rises.' },
    { l: 'Peak on a β-blocker', set: { exer: 1, bb: 0.8 }, w: 'Heart rate and contractility are blunted, output falls short and SvO₂ drops further.' },
    { l: 'Stiff ventricle exercising', set: { exer: 0.6, LV_k: 0.045, LV_tau: 0.065 }, w: 'Shortened diastole plus slow relaxation pushes LA pressure up steeply: exertional dyspnoea in HFpEF.' },
  ],
  keys: ['Output rises through rate (dominant) and stroke volume (contractility, venous return).', 'The fall in SVR keeps mean pressure near baseline despite tripled output.', 'Faster relaxation protects filling when diastole shortens.'] },

{ id: 'lv-ao-coupling', t: 'LV–arterial coupling',
  lede: 'Stroke volume falls out of where two lines meet: the ESPVR (slope Ees) and the effective arterial elastance line (slope Ea). Their ratio Ea/Ees sets ejection fraction and efficiency.',
  ctrls: ['LV_Ees', 'Ras', 'Cas', 'HR'],
  panels: [pvLV({ ea: true, edpvr: false }), wL()],
  ro: ['Ea', 'EesEff', 'EaEes', 'SV', 'EF', 'SW', 'eff', 'ESP'],
  tries: [
    { l: 'Failing heart (Ees 0.8)', set: { LV_Ees: 0.8 }, w: 'Ea/Ees climbs well above 1; EF and efficiency fall.' },
    { l: 'Failing heart, unload it', set: { LV_Ees: 0.8, Ras: 0.55 }, w: 'Lowering Ea brings the ratio back toward 1 and restores stroke volume: afterload reduction.' },
    { l: 'Faster heart rate', set: { HR: 110 }, w: 'Ea rises with heart rate (≈ R/T), so faster rates raise effective afterload.' },
  ],
  keys: ['SV ≈ (EDV − V₀) ÷ (1 + Ea/Ees).', 'Ea/Ees near 1 maximises stroke work; near 0.5 maximises efficiency. Normal hearts sit between.', 'EF ≈ 1 ÷ (1 + Ea/Ees) when V₀ is small.'] },

// ---------------- valves
{ id: 'aortic-stenosis', t: 'Aortic stenosis',
  lede: 'A narrowed aortic orifice adds a flow-dependent pressure drop between LV and aorta, ΔP = 4v². The ventricle must generate far more pressure than the aorta sees.',
  preset: { av_f: 0.9 }, ctrls: ['av_f', 'LV_Ees', 'LV_k', 'dobu'],
  panels: [wL({ ymax: 200 }), pvLV(), wF({ sig: ['Qav'], title: 'Aortic flow', wide: true, h: 170 })],
  ro: ['AVmg', 'AVpg', 'AoVmax', 'BP', 'LVSP', 'SV', 'LVEDP', 'CO'],
  tries: [
    { l: 'Critical AS (0.5 cm²)', set: { av_f: 0.5 }, w: 'LV systolic pressure climbs while aortic pressure falls; stroke volume drops and the aortic upstroke slows.' },
    { l: 'Hypertrophied LV', set: { LV_Ees: 3.6, LV_k: 0.04 }, w: 'Concentric hypertrophy preserves stroke volume against the gradient, but the stiff chamber needs a high EDP.' },
    { l: 'Low-flow, low-gradient', set: { av_f: 0.8, LV_Ees: 0.9 }, w: 'With a weak ventricle the mean gradient falls despite a tight valve: gradients depend on flow.' },
    { l: 'Dobutamine challenge', set: { av_f: 0.8, LV_Ees: 0.9, dobu: 15 }, w: 'Flow rises and the gradient rises with it while the valve area stays fixed: true severe AS.' },
  ],
  keys: ['Severe AS: AVA < 1.0 cm², mean gradient ≥ 40 mmHg, Vmax ≥ 4 m/s.', 'Gradient scales with flow squared, so low output hides severity.', 'The hypertrophied ventricle is pressure-loaded, stiff and preload-dependent.'] },

{ id: 'aortic-regurgitation', t: 'Aortic regurgitation',
  lede: 'A leaking aortic valve lets blood return to the ventricle in diastole. The LV must eject the regurgitant volume again every beat, so total stroke volume rises while forward flow falls.',
  preset: { av_r: 0.3 }, ctrls: ['av_r', 'HR', 'Ras', 'LV_V0', 'LV_k'],
  panels: [wL(), pvLV(), wF({ sig: ['Qav'], title: 'Aortic flow (negative = regurgitant)', wide: true, h: 180 })],
  ro: ['BP', 'PP', 'ARvol', 'ARF', 'SV', 'fwdSV', 'LVEDP', 'LVEDV'],
  tries: [
    { l: 'Acute severe AR', set: { av_r: 0.5 }, w: 'LV diastolic pressure shoots up and meets aortic diastolic pressure; there are no isovolumic sides to the loop.' },
    { l: 'Chronic adaptation', set: { av_r: 0.5, LV_V0: 60, LV_k: 0.013 }, w: 'A large, compliant LV accepts the regurgitant volume at a low EDP: huge stroke volume, wide pulse pressure.' },
    { l: 'Faster heart rate', set: { HR: 100 }, w: 'Shorter diastole means less time to regurgitate per beat.' },
    { l: 'Vasodilate', set: { Ras: 0.6 }, w: 'Lower aortic diastolic pressure reduces the driving pressure for regurgitation.' },
  ],
  keys: ['Severe AR: regurgitant fraction ≥ 50%, EROA ≥ 0.3 cm².', 'Wide pulse pressure and low diastolic pressure are the bedside signature of chronic AR.', 'Acute AR is poorly tolerated because the LV has not dilated.'] },

{ id: 'mitral-stenosis', t: 'Mitral stenosis',
  lede: 'A narrowed mitral orifice needs a pressure gradient to fill the ventricle. LA pressure rises, and the gradient depends heavily on how much diastolic time there is.',
  preset: { mv_f: 1.2 }, ctrls: ['mv_f', 'HR', 'rhythm', 'dV'],
  panels: [wL({ ymax: 40, fixed: true, title: 'LV and LA in diastole (0–40 mmHg)', sig: ['LVP', 'LAP'] }), wF({ sig: ['Qmv'], title: 'Mitral inflow' }), { type: 'pv', ch: ['LV', 'LA'], title: 'LV and LA loops' }, wR({ wide: true, h: 180 })],
  ro: ['MVmg', 'LAP', 'mPAP', 'CO', 'LVEDV', 'HR'],
  tries: [
    { l: 'Severe MS (1.0 cm²)', set: { mv_f: 1 }, w: 'A persistent LA–LV gradient through diastole; LA and pulmonary pressures rise while the LV underfills.' },
    { l: 'Heart rate 115', set: { HR: 115 }, w: 'Less diastolic time, so the same volume must cross faster: the gradient and LA pressure jump.' },
    { l: 'Atrial fibrillation', set: { rhythm: 1, HR: 110 }, w: 'Loss of atrial contraction plus fast, irregular cycles: output falls and LA pressure rises.' },
    { l: 'Rate control (β-blocker)', set: { HR: 115, bb: 0.6 }, w: 'Slowing the rate lengthens diastole and lowers the gradient.' },
  ],
  keys: ['Severe MS: MVA ≤ 1.5 cm²; mean gradient is rate-dependent.', 'The LV is protected; the LA and pulmonary circulation take the load.', 'Rate control is a core treatment because it buys diastolic time.'] },

{ id: 'mitral-regurgitation', t: 'Mitral regurgitation',
  lede: 'In MR the ventricle ejects backward into the LA as well as forward into the aorta. Ejection starts before the aortic valve opens, so there is no true isovolumic contraction.',
  preset: { mv_r: 0.35 }, ctrls: ['mv_r', 'LA_k', 'Ras', 'LV_Ees'],
  panels: [wL(), { type: 'pv', ch: ['LV', 'LA'], title: 'LV and LA loops', espvr: true }, wF({ wide: true, h: 180, title: 'Mitral and aortic flow (negative mitral = regurgitant)' })],
  ro: ['MRvol', 'MRF', 'SV', 'fwdSV', 'EF', 'LAP', 'LAv', 'mPAP'],
  tries: [
    { l: 'Acute severe MR', set: { mv_r: 0.55, LA_k: 0.09 }, w: 'A small, stiff LA produces giant v-waves and high pulmonary pressures; forward output falls.' },
    { l: 'Chronic, compliant LA', set: { mv_r: 0.55, LA_k: 0.03, LV_V0: 30 }, w: 'A large compliant LA absorbs the regurgitant volume at lower pressure; v-waves shrink.' },
    { l: 'Afterload reduction', set: { Ras: 0.55 }, w: 'Lower aortic pressure favours forward ejection: regurgitant fraction falls and forward SV rises.' },
  ],
  keys: ['EF overstates LV function in MR because part of the ejection goes into a low-pressure chamber.', 'v-wave height depends on LA compliance as much as MR severity.', 'Vasodilators and mechanical unloading reduce the regurgitant fraction.'] },

// ---------------- disease
{ id: 'cad', t: 'Coronary artery disease',
  lede: 'Coronary flow happens mostly in diastole and is driven by aortic diastolic pressure minus LV diastolic pressure. When demand (set by pressure–volume area) outstrips what a stenosed artery can deliver, ischaemia weakens and stiffens the LV.',
  preset: { cadOn: 1, sten: 70 }, ctrls: ['sten', 'exer', 'bb', 'ntg'], acts: ['pci'],
  panels: [{ type: 'cor', title: 'Coronary supply vs demand' }, pvLV(), wL({ wide: true, h: 200 })],
  ro: ['SD', 'CBF', 'isch', 'MVO2', 'HR', 'BP', 'LVEDP', 'EF', 'Pdia', 'fdia'],
  tries: [
    { l: 'Exercise 50%', set: { exer: 0.5 }, w: 'Demand rises while the 70% stenosis caps supply. Once the ratio falls below 1, EF falls and EDP rises: demand ischaemia.' },
    { l: 'Exercise on a β-blocker', set: { exer: 0.5, bb: 0.8 }, w: 'Lower heart rate cuts demand and lengthens diastole, restoring the supply–demand balance.' },
    { l: 'Critical stenosis (92%)', set: { sten: 92 }, w: 'Ischaemia at rest: the LV weakens, pressure falls, which lowers perfusion further.' },
    { l: 'Revascularise', set: { sten: 0 }, w: 'Supply capacity returns and function recovers over a few beats.' },
  ],
  keys: ['Supply depends on diastolic pressure, diastolic time and stenosis resistance.', 'Demand tracks pressure–volume area and contractility (heart rate × PVA).', 'Diastolic dysfunction (stiffer, slower LV) appears before systolic failure.', 'β-blockers help twice: less demand and more diastolic perfusion time.'] },

{ id: 'cardiogenic-shock', t: 'Cardiogenic shock',
  lede: 'A severely weakened LV with high filling pressures, low output and hypotension. Ischaemic feedback is on: low aortic pressure starves the myocardium, which can spiral.',
  preset: { LV_Ees: 0.75, LV_V0: 25, dV: 400, HR: 100, cadOn: 1, sten: 70 }, fx: true, ctrls: ['ne', 'epi', 'vaso', 'dobu', 'milr', 'dopa', 'imp', 'ecmo', 'dV'],
  panels: [pvLV(), wL(), wR({ wide: true, h: 180 })],
  ro: ['BP', 'MAP', 'CI', 'CPO', 'LVEDP', 'LAP', 'RAP', 'PAPi', 'SvO2', 'SD', 'isch', 'imp', 'ecmo'],
  tries: [
    { l: 'Norepinephrine 0.15', set: { ne: 0.15 }, w: 'Pressure rises and coronary perfusion improves, but the weak LV faces more afterload: stroke volume may fall and LVEDP rise.' },
    { l: 'Dobutamine 7.5', set: { dobu: 7.5 }, w: 'Contractility and output rise, with more heart rate and myocardial O₂ demand.' },
    { l: 'Vasopressin 0.04', set: { vaso: 0.04 }, w: 'A pure vasoconstrictor: pressure rises, but with no inotropy the weak LV ejects less and LVEDP climbs.' },
    { l: 'Epinephrine 0.1', set: { epi: 0.1 }, w: 'Inotropy, chronotropy and some vasoconstriction together: output and pressure both rise, at a high O₂ cost.' },
    { l: 'Impella CP (P8)', set: { imp: 8 }, w: 'The pump unloads the LV: the loop becomes triangular and shifts left, LVEDP and MVO₂ fall, mean pressure rises.' },
    { l: 'V-A ECMO 4 L/min', set: { ecmo: 4 }, w: 'Perfusion pressure is restored, but the LV now ejects against ECMO afterload: watch LVEDP and pulmonary pressures.' },
  ],
  keys: ['Cardiac power output (MAP × CO ÷ 451) < 0.6 W predicts poor outcome.', 'PAPi < 1 suggests associated RV failure.', 'Pressors buy perfusion pressure at the cost of LV afterload; inotropes buy output at the cost of O₂ demand.', 'LV-to-aorta pumps unload; V-A ECMO perfuses but loads the LV.'] },

{ id: 'hfref', t: 'Heart failure with reduced EF',
  lede: 'A dilated, weakly contracting LV: the ESPVR is shallow and shifted right. The heart compensates with volume and a large end-diastolic volume, at the price of congestion.',
  preset: HF_BASE, fx: true, ctrls: ['LV_Ees', 'dV', 'Ras', 'acei', 'arni', 'snp', 'dobu'],
  panels: [pvLV(), wL(), wR({ wide: true, h: 180 })],
  ro: ['BP', 'CO', 'SV', 'EF', 'LVEDV', 'LVEDP', 'LAP', 'mPAP', 'EaEes'],
  tries: [
    { l: 'Diuresis 500 mL', set: { dV: 0 }, w: 'Filling pressures fall a lot; stroke volume falls only a little because the heart sits on the flat part of its Starling curve.' },
    { l: 'Afterload reduction (nitroprusside)', set: { snp: 1 }, w: 'Lower Ea lets the weak LV eject more: SV rises, LVEDP falls, pressure falls only modestly.' },
    { l: 'ACE inhibitor/ARB, target dose', set: { acei: 1 }, w: 'Oral afterload reduction: SVR falls about 20%, stroke volume rises and filling pressures fall, with a modest drop in pressure.' },
    { l: 'ARNI, target dose', set: { arni: 1 }, w: 'Neprilysin inhibition adds venodilation to the ARB effect: filling pressures fall further than with an ACE inhibitor/ARB.' },
    { l: 'Inotrope', set: { dobu: 5 }, w: 'Higher Ees raises SV and lowers ESV, with a heart-rate and O₂ cost.' },
    { l: 'Decompensation (+800 mL)', set: { dV: 1300 }, w: 'LA and PA pressures climb into the pulmonary oedema range with little gain in output.' },
  ],
  keys: ['EF ≤ 40%: low Ees, large V₀, high Ea/Ees.', 'Afterload reduction is especially effective when Ees is low.', 'Volume moves pressure much more than output once the curve flattens.'] },

{ id: 'hfpef', t: 'Heart failure with preserved EF',
  lede: 'A small, stiff LV with slow relaxation and stiff arteries. EF is normal, but the steep EDPVR means filling pressures soar with small volume changes, faster heart rates or exercise.',
  preset: { LV_k: 0.042, LV_A: 0.4, LV_tau: 0.06, LV_Ees: 3.2, Cas: 0.85, dV: 150 }, ctrls: ['LV_k', 'LV_tau', 'dV', 'HR', 'exer'],
  panels: [pvLV(), wL(), wF({ sig: ['Qmv'], title: 'Mitral inflow', wide: true, h: 170 })],
  ro: ['BP', 'EF', 'SV', 'LVEDV', 'LVEDP', 'LAP', 'EA', 'CO'],
  tries: [
    { l: 'Add 300 mL', set: { dV: 450 }, w: 'A modest volume gain sends LVEDP sharply up the steep EDPVR.' },
    { l: 'Exercise 40%', set: { exer: 0.4 }, w: 'Shorter diastole and inadequate relaxation reserve: LA pressure rises much more than in a normal heart.' },
    { l: 'Diuresis', set: { dV: -200 }, w: 'Filling pressure falls, but so does stroke volume quickly: a narrow therapeutic window.' },
    { l: 'Heart rate 110', set: { HR: 110 }, w: 'Incomplete relaxation raises diastolic pressure; output gains little.' },
  ],
  keys: ['Normal Ees (often high), steep EDPVR, slow τ, stiff arteries (high Ea).', 'Blood pressure and filling pressures are very volume-sensitive.', 'Exercise intolerance comes from filling pressures, not from low resting output.'] },

{ id: 'cardiac-amyloidosis', t: 'Cardiac amyloidosis',
  lede: 'Amyloid infiltration makes a small, thick, stiff ventricle that relaxes slowly, with weak atria. EF stays near normal, but stroke volume is small and almost fixed. Output then depends on heart rate, and blood pressure follows SVR closely, especially when autonomic neuropathy has removed the reflexes.',
  preset: { LV_tau: 0.07, LV_Ees: 2.4, LV_V0: 0, LV_k: 0.04, LV_A: 0.4, LA_Ees: 0.1, LA_k: 0.07, RV_k: 0.035, RV_A: 0.4, eff: 60, HR: 80, dV: 450, ecgV: 0.35 },
  fx: true, ctrls: ['Ras', 'baro', 'mido', 'acei', 'tCI', 'tCIlever', 'HR', 'dV', 'bb'],
  panels: [
    { type: 'svr', y: 'MAP', yl: 'Mean arterial pressure (mmHg)', title: 'Mean arterial pressure across SVR', band: [65, 100] },
    { type: 'svr', y: 'CI', yl: 'Cardiac index (L/min/m²)', title: 'Cardiac index across SVR', band: [2.2, 4] },
    pvLV({ title: 'LV pressure–volume loop (small, steep, high EDP)' }),
    wF({ sig: ['Qmv'], title: 'Mitral inflow (tall E, tiny A)' }),
    ecg({ title: 'ECG (low voltage)' }),
  ],
  ro: ['BP', 'MAP', 'HR', 'CI', 'SV', 'EF', 'LVEDV', 'LVEDP', 'RAP', 'LAP', 'SVR', 'EA', 'DT', 'tgt', 'reflex'],
  tries: [
    { l: 'Vasodilate (SVR ≈ 700)', set: { Ras: 0.52 }, w: 'Pressure falls steeply while stroke volume barely rises: the small, stiff LV cannot fill or eject more. This is why ACE inhibitors, nitrates and dihydropyridines are poorly tolerated.' },
    { l: 'Vasodilate, reflexes intact', set: { Ras: 0.52, baro: 1 }, w: 'The reflex defends pressure almost entirely through heart rate. Stroke volume stays near 50 mL, so output is rate-dependent.' },
    { l: 'Midodrine 10 mg', set: { mido: 10 }, w: 'α₁ agonism raises SVR and venous tone: pressure rises nearly in step, and stroke volume falls only a little because SV is fixed.' },
    { l: 'ACE inhibitor, target dose', set: { acei: 1 }, w: 'Afterload reduction lowers pressure by about 12 mmHg with almost no gain in output: why ACE inhibitors/ARBs/ARNI are poorly tolerated in cardiac amyloidosis.' },
    { l: 'Reflexes on, add a β-blocker', set: { baro: 1, bb: 0.7, Ras: 0.7 }, w: 'Blocking the rate response removes the only compensation: pressure and cardiac index fall together.' },
    { l: 'Diuresis 400 mL', set: { dV: 50 }, w: 'CVP and LVEDP fall, but stroke volume and pressure fall too: the diuresis window is narrow.' },
    { l: 'Target cardiac index 3.0 by heart rate', set: { tCI: 3, tCIlever: 0 }, w: 'Rate climbs, but past roughly 120 bpm the shortened diastole limits filling and cardiac index stops rising. The status turns to “out of reach”.' },
    { l: 'Target cardiac index 3.0 by lowering SVR', set: { tCI: 3, tCIlever: 2 }, w: 'Driving SVR down raises output only a little and drags MAP below 60: afterload reduction cannot fix a filling problem.' },
  ],
  keys: [
    'Physiology: steep EDPVR, prolonged τ, normal Ees, small EDV, weak atrial kick. EF is preserved but SV and CI are low.',
    'With SV fixed, CO ≈ HR × a small SV, and MAP ≈ CO × SVR. Vasodilators lower pressure with little gain in flow.',
    'Autonomic neuropathy (common in AL, also seen in ATTR) removes reflex defence: orthostatic hypotension; midodrine raises SVR.',
    'Rate-slowing drugs are poorly tolerated because output is rate-dependent. Diuresis has a narrow window between congestion and low output.',
    'Clues: low QRS voltage despite thick walls; restrictive inflow (E/A > 2, deceleration time < 150 ms) in advanced disease.',
  ] },

// ---------------- gas exchange
{ id: 'alveolar-gas-equation', t: 'Alveolar gas equation', kind: 'gas', gro: 'aga',
  lede: 'Alveolar PO₂ = FiO₂ × (P<sub>B</sub> − 47) − PaCO₂ ÷ R. Inspired oxygen sets the ceiling; every mmHg of CO₂ in the alveolus displaces oxygen.',
  gctrls: ['FiO2', 'alt', 'PaCO2', 'R', 'Aa', 'age'],
  panels: [{ type: 'aga', title: 'Alveolar PO₂ against PaCO₂' }],
  tries: [
    { l: 'Denver (1,600 m)', gset: { alt: 1609 }, w: 'Barometric pressure is about 630 mmHg; alveolar PO₂ falls by roughly 25 mmHg.' },
    { l: 'Everest summit', gset: { alt: 8848, PaCO2: 13 }, w: 'P<sub>B</sub> ≈ 250 mmHg. Only extreme hyperventilation (PaCO₂ ≈ 13) keeps alveolar PO₂ above 30.' },
    { l: 'Opioid hypoventilation', gset: { PaCO2: 80 }, w: 'On room air PAO₂ falls to about 50: hypoxaemia with a normal A–a gradient.' },
    { l: 'Same patient on 28% O₂', gset: { PaCO2: 80, FiO2: 0.28 }, w: 'A small rise in FiO₂ fully corrects hypoventilation hypoxaemia, but not the hypercapnia.' },
  ],
  keys: ['Normal room-air PAO₂ at sea level ≈ 100 mmHg.', 'Pure hypoventilation lowers PaO₂ with a normal A–a gradient.', 'Expected A–a gradient on room air ≈ age ÷ 4 + 4.'] },

{ id: 'hb-o2-dissociation', t: 'Hb–O₂ dissociation curve', kind: 'gas', gro: 'odc',
  lede: 'Haemoglobin loads O₂ cooperatively, giving a sigmoid curve. P50, the PO₂ at 50% saturation, summarises where the curve sits: right shifts favour unloading, left shifts favour loading.',
  gctrls: ['PO2', 'PvO2', 'pH', 'T', 'dpg', 'COHb', 'HbF'],
  panels: [{ type: 'odc', title: 'Oxyhaemoglobin dissociation curve' }],
  tries: [
    { l: 'Acidosis and fever', gset: { pH: 7.2, T: 39.5 }, w: 'Right shift (Bohr effect, heat): P50 rises and more O₂ is released at the same venous PO₂.' },
    { l: 'Alkalosis and hypothermia', gset: { pH: 7.55, T: 34 }, w: 'Left shift: Hb holds O₂ more tightly; tissues must fall to a lower PO₂ to extract it.' },
    { l: 'CO poisoning (30%)', gset: { COHb: 0.3 }, w: 'Capacity falls and the remaining curve shifts left. The pulse oximeter overreads because it counts COHb as oxygenated.' },
    { l: 'Fetal haemoglobin', gset: { HbF: 1 }, w: 'P50 ≈ 19 mmHg: fetal blood loads O₂ from maternal blood at low PO₂.' },
  ],
  keys: ['Normal adult P50 ≈ 27 mmHg; SaO₂ 90% at PaO₂ ≈ 60.', 'Right shift: ↑H⁺, ↑CO₂, ↑temperature, ↑2,3-DPG.', 'The flat top protects saturation; the steep middle drives unloading.'] },

{ id: 'blood-o2-content', t: 'Blood O₂ content', kind: 'gas', gro: 'o2c',
  lede: 'CaO₂ = 1.34 × Hb × SaO₂ + 0.003 × PaO₂. Almost all oxygen rides on haemoglobin; dissolved O₂ matters only at very high PO₂.',
  gctrls: ['Hb', 'PO2', 'CO', 'COHb'],
  panels: [{ type: 'o2c', title: 'O₂ content against PO₂' }],
  tries: [
    { l: 'Anaemia (Hb 7)', gset: { Hb: 7 }, w: 'Saturation and PaO₂ are normal but content roughly halves; delivery falls unless output rises.' },
    { l: 'Hyperoxia (PO₂ 500)', gset: { PO2: 500 }, w: 'Dissolved O₂ rises to about 1.5 mL/dL; the Hb-bound part barely changes.' },
    { l: 'CO poisoning (30%)', gset: { COHb: 0.3 }, w: 'Effective Hb falls by 30% at a normal PaO₂.' },
    { l: 'Low output', gset: { CO: 2.5 }, w: 'Same content, half the delivery: DO₂ = CO × CaO₂ × 10.' },
  ],
  keys: ['Normal CaO₂ ≈ 20 mL/dL; DO₂ ≈ 1,000 mL/min.', 'PaO₂ is a pressure, not a quantity: anaemia lowers content with a normal PaO₂.', 'Transfusion and output raise delivery more than extra oxygen once Hb is saturated.'] },

{ id: 'fick-equation', t: 'Fick equation', kind: 'gas', gro: 'fick',
  lede: 'VO₂ = CO × (CaO₂ − CvO₂). With oxygen consumption fixed, a wider arterial–venous gap means lower cardiac output. Mixed venous saturation is the bedside window into this balance.',
  gctrls: ['VO2', 'Hb', 'SaO2', 'SvO2'],
  panels: [{ type: 'fick', title: 'Cardiac output implied by SvO₂' }],
  tries: [
    { l: 'Low-output state (SvO₂ 50%)', gset: { SvO2: 0.5 }, w: 'The a–v difference widens and the implied output drops below 3.5 L/min.' },
    { l: 'Distributive shock (SvO₂ 85%)', gset: { SvO2: 0.85 }, w: 'A narrow a–v gap implies high output, or tissues that cannot extract.' },
    { l: 'Anaemia (Hb 8)', gset: { Hb: 8 }, w: 'At the same saturations, lower content forces a higher output to meet VO₂.' },
    { l: 'Exercise (VO₂ 1,500)', gset: { VO2: 1500, SvO2: 0.4 }, w: 'Both output and extraction rise to meet a six-fold increase in VO₂.' },
  ],
  keys: ['CO = VO₂ ÷ [(SaO₂ − SvO₂) × 1.34 × Hb × 10].', 'Assumed VO₂ (≈ 125 mL/min/m²) is the main error source in the indirect Fick method.', 'SvO₂ falls when delivery falls relative to demand: low output, anaemia, hypoxaemia, high VO₂.'] },

{ id: 'vq-mismatch', t: 'V/Q mismatch', kind: 'gas', gro: 'vq',
  lede: 'A lung with two units: each gets a share of ventilation and of perfusion. Each unit\'s V/Q ratio fixes its alveolar gas on the O₂–CO₂ diagram, and the arterial blood is the flow-weighted mix.',
  gctrls: ['vV', 'vQ', 'VAt', 'Qt', 'PvO2', 'PvCO2'],
  panels: [{ type: 'vq', title: 'O₂–CO₂ diagram with V/Q line' }],
  tries: [
    { l: 'Matched (50/50)', gset: { vV: 0.5, vQ: 0.5 }, w: 'Both units share one V/Q of about 0.86; A–a gradient is near zero.' },
    { l: 'Low V/Q unit (pneumonia)', gset: { vV: 0.15, vQ: 0.5 }, w: 'Unit A slides toward the venous point. Its desaturated blood cannot be offset by unit B, which is already on the flat curve.' },
    { l: 'High V/Q unit (embolus)', gset: { vV: 0.5, vQ: 0.1 }, w: 'Unit A heads toward inspired gas but carries little blood: wasted ventilation and a rising PaCO₂ unless total ventilation rises.' },
    { l: 'Hyperventilate the mismatch', gset: { vV: 0.15, vQ: 0.5, VAt: 8 }, w: 'More ventilation clears CO₂ well but improves PaO₂ much less: the O₂ curve is flat at the top.' },
  ],
  keys: ['Low V/Q units cause hypoxaemia; high V/Q units cause dead space.', 'CO₂ retention from mismatch is usually corrected by raising ventilation; hypoxaemia is not.', 'V/Q mismatch responds to supplemental O₂ (unlike true shunt).'] },

{ id: 'shunt', t: 'Shunt', kind: 'gas', gro: 'shunt',
  lede: 'Shunted blood bypasses ventilated alveoli entirely, so extra inspired O₂ never reaches it. Mixed venous O₂ (from the Fick principle) also matters: lower output makes shunted blood darker.',
  gctrls: ['s', 'FiO2', 'CO', 'Hb', 'VO2'],
  panels: [{ type: 'shunt', title: 'Iso-shunt diagram: PaO₂ against FiO₂' }],
  tries: [
    { l: '30% shunt on 100% O₂', gset: { s: 0.3, FiO2: 1 }, w: 'PaO₂ barely passes 100 mmHg despite pure oxygen.' },
    { l: '10% shunt, then O₂', gset: { s: 0.1, FiO2: 0.6 }, w: 'Small shunts still respond well to supplemental O₂.' },
    { l: 'Shunt with low output', gset: { s: 0.3, FiO2: 0.6, CO: 3 }, w: 'Lower output drops SvO₂, so the shunted blood carries less O₂ and PaO₂ falls with no change in the lung.' },
  ],
  keys: ['Above about 30% shunt, PaO₂ responds little to FiO₂.', 'Shunt fraction Qs/Qt = (Cc′ − Ca) ÷ (Cc′ − Cv).', 'Raising output or Hb raises PaO₂ in shunt by brightening venous blood.'] },

{ id: 'ventilation', t: 'Ventilation', kind: 'gas', gro: 'vent',
  lede: 'PaCO₂ = 0.863 × VCO₂ ÷ V<sub>A</sub>. Only alveolar ventilation clears CO₂; dead space ventilation does not. The relation is a hyperbola: halving V<sub>A</sub> doubles PaCO₂.',
  gctrls: ['VT', 'RRb', 'VDan', 'VDalv', 'VCO2'],
  panels: [{ type: 'vent', title: 'PaCO₂ against alveolar ventilation' }],
  tries: [
    { l: 'Rapid shallow (250 × 24)', gset: { VT: 250, RRb: 24 }, w: 'Same minute ventilation as 500 × 12, but more of each breath is dead space: PaCO₂ rises.' },
    { l: 'Fever / sepsis (VCO₂ 320)', gset: { VCO2: 320 }, w: 'The whole hyperbola moves up; ventilation must rise to hold PaCO₂.' },
    { l: 'Pulmonary embolism', gset: { VDalv: 180 }, w: 'Alveolar dead space wastes ventilation; VD/VT rises and expired CO₂ falls below arterial.' },
    { l: 'Hyperventilation', gset: { VT: 700, RRb: 18 }, w: 'PaCO₂ falls into the 20s; alveolar PO₂ rises a little.' },
  ],
  keys: ['V<sub>A</sub> = (VT − VD) × RR.', 'Normal VD/VT ≈ 0.3; Bohr: VD/VT = (PaCO₂ − PēCO₂) ÷ PaCO₂.', 'On the steep part of the hyperbola, small V<sub>A</sub> falls cause large PaCO₂ rises.'] },

{ id: 'diffusion-aa-gradient', t: 'Diffusion and the A–a gradient', kind: 'gas', gro: 'diff',
  lede: 'Red cells spend about 0.75 s in a pulmonary capillary at rest and normally equilibrate with alveolar gas within a third of that. A thickened barrier or a shorter transit time can leave end-capillary PO₂ below alveolar PO₂.',
  gctrls: ['DL', 'tt', 'FiO2', 'alt', 's', 'PvO2', 'age'],
  panels: [{ type: 'diff', title: 'O₂ uptake along the pulmonary capillary' }],
  tries: [
    { l: 'Exercise (0.25 s transit)', gset: { tt: 0.25, PvO2: 25 }, w: 'A normal lung still equilibrates, although the reserve is used up.' },
    { l: 'Fibrosis (DL 8)', gset: { DL: 8 }, w: 'Uptake slows; at rest the blood still nearly reaches alveolar PO₂.' },
    { l: 'Fibrosis with exercise', gset: { DL: 8, tt: 0.25, PvO2: 25 }, w: 'Equilibrium fails: exertional desaturation with a wide A–a gradient.' },
    { l: 'Add oxygen (40%)', gset: { DL: 8, tt: 0.25, PvO2: 25, FiO2: 0.4 }, w: 'A higher alveolar PO₂ drives diffusion faster and corrects diffusion limitation.' },
  ],
  keys: ['Causes of a wide A–a gradient: V/Q mismatch, shunt, diffusion limitation.', 'Diffusion limitation is unmasked by exercise, altitude and low mixed venous PO₂.', 'Hypoventilation alone keeps the A–a gradient normal.'] },

// ---------------- bedside

  fx: true, ctrls: ['dV', 'Ras', 'LV_Ees', 'HR', 'eff', 'Rap', 'resp', 'ne', 'vaso', 'epi', 'phenyl', 'dobu', 'tCI', 'tCIlever', 'baro'],

    { l: 'Septic shock', reset: true, set: { Ras: 0.4, V0sv: 3200, HR: 115, dV: 250, LV_Ees: 2.5 }, w: 'Low SVR, wide pulse pressure, low diastolic pressure, normal or high output.' },
    { l: 'Cardiogenic shock', reset: true, set: { LV_Ees: 0.7, LV_V0: 25, dV: 450, HR: 104 }, w: 'High PCWP and PA pressures, narrow pulse pressure, low output.' },

    { l: 'Ventilated, dry', reset: true, set: { resp: 2, dV: -450 }, w: 'Arterial pulse pressure swings with each breath: pulse pressure variation above ~12% predicts fluid responsiveness.' },
  ],
  keys: ['Combine CVP, PCWP, output and SVR to classify shock.', 'Pulse pressure variation needs controlled ventilation and a regular rhythm to be interpretable.', 'No reflexes are modelled: changes appear in isolation, which makes the primary effect easy to see.'] },

{ id: 'patient-monitor-student', t: 'Patient monitor: student', kind: 'student',
  lede: 'A mystery patient. The parameters are hidden; you only get what a real monitor shows. Make the diagnosis, or test a treatment first and watch the response.',
  panels: [{ type: 'monitor', title: 'Bedside monitor', wide: true, h: 430 }],
  ro: [],
  keys: ['Start with pressure and output, then filling pressures, then SVR and SvO₂.', 'Equal CVP and PCWP point toward the pericardium.', 'A high CVP with a low PCWP points to the right heart.'] },

// ---------------- mechanical support
{ id: 'vv-ecmo', t: 'V-V ECMO', kind: 'gas', gro: 'vv',
  lede: 'Venovenous ECMO drains venous blood, oxygenates it and returns it to the right atrium. It works in series with the lungs, so arterial saturation depends on what fraction of the cardiac output passes through the oxygenator.',
  gctrls: ['Qe', 'recirc', 'CO', 'shuntvv', 'FiO2', 'Hb', 'sweep', 'VAvv'],
  gpreset: { FiO2: 0.5, Hb: 12, CO: 6, VCO2: 220 },
  panels: [{ type: 'vv', title: 'Arterial saturation against ECMO flow' }],
  tries: [
    { l: 'Raise flow to 5.5', gset: { Qe: 5.5 }, w: 'Saturation rises as ECMO flow approaches cardiac output.' },
    { l: 'Hyperdynamic patient (CO 9)', gset: { CO: 9 }, w: 'The same ECMO flow now covers a smaller share of output: saturation falls.' },
    { l: 'High recirculation (35%)', gset: { recirc: 0.35 }, w: 'Reinfused blood is drained again, wasting oxygenator capacity. Repositioning cannulas is the fix.' },
    { l: 'Raise sweep to 8', gset: { sweep: 8 }, w: 'CO₂ clearance rises; oxygenation does not change. Blood flow sets O₂, sweep sets CO₂.' },
  ],
  keys: ['Target ECMO flow ≈ 60% or more of cardiac output for adequate oxygenation.', 'Hypoxaemia on V-V ECMO: low flow, high output, recirculation or low Hb.', 'No direct haemodynamic support: the heart still pumps everything.'] },

{ id: 'va-ecmo', t: 'V-A ECMO',
  lede: 'Venoarterial ECMO drains the right atrium and pumps oxygenated blood into a femoral artery, in parallel with the heart. It restores perfusion but raises the pressure the LV must eject against, and the two streams meet somewhere in the aorta.',
  preset: { LV_Ees: 0.8, LV_V0: 20, dV: 300, HR: 95, ecmo: 3.5 }, ctrls: ['ecmo', 'LV_Ees', 'dobu'], gctrls: ['natSat'],
  panels: [{ type: 'aorta', title: 'Where the native and ECMO streams meet', h: 340 }, pvLV(), wL({ wide: true, h: 200 })],
  ro: ['ecmo', 'LVout', 'totFlow', 'MAP', 'PP', 'LVEDP', 'LAP', 'SvO2'],
  tries: [
    { l: 'Full flow (5 L/min)', set: { ecmo: 5 }, w: 'Pulse pressure narrows as the LV ejects less; LVEDP and PCWP climb.' },
    { l: 'Recovering LV, sick lungs', set: { LV_Ees: 2 }, gset: { natSat: 0.75 }, w: 'More native ejection pushes the mixing zone down the aorta. Desaturated blood from the lungs now feeds the coronaries and the right arm: differential (north–south) hypoxaemia.' },
    { l: 'Weaning trial (1.5 L/min)', set: { ecmo: 1.5, LV_Ees: 1.6 }, w: 'Pulsatility returns and the LV carries the load: a recovering heart tolerates low flow.' },
  ],
  keys: ['Monitor right-radial SpO₂ or ABG to catch differential hypoxaemia.', 'Rising ECMO flow raises afterload: watch pulse pressure, aortic valve opening and LVEDP.', 'Pulse pressure is a simple marker of native LV ejection.'] },

{ id: 'ecmo-hemodynamics', t: 'ECMO haemodynamics',
  lede: 'Sweep V-A ECMO flow from 0 to 5 L/min in a failing heart and see the trade-off: arterial pressure rises, while LV stroke volume falls and LV volume and LA pressure rise.',
  preset: { LV_Ees: 0.9, LV_V0: 20, dV: 300, HR: 95, ecmo: 0 }, ctrls: ['ecmo', 'LV_Ees', 'Ras', 'dV'], acts: ['ramp'],
  panels: [{ type: 'ramp', title: 'Haemodynamics across ECMO flows' }, pvLV()],
  ro: ['ecmo', 'MAP', 'PP', 'SV', 'LVEDV', 'LVEDP', 'LAP', 'totFlow'],
  tries: [
    { l: 'Run the ramp', act: 'ramp', pin: false, keep: true, w: 'Pinned loops at 0, 2.5 and 5 L/min march rightward and upward: the LV becomes larger and more pressurised.' },
    { l: 'Ramp with high SVR', set: { Ras: 1.6 }, act: 'ramp', pin: false, w: 'Vasoconstriction steepens the afterload penalty of ECMO flow.' },
    { l: 'Ramp with better LV', set: { LV_Ees: 1.8 }, act: 'ramp', pin: false, w: 'A stronger LV keeps ejecting across the range.' },
  ],
  keys: ['ECMO flow raises mean pressure roughly in proportion to flow × SVR.', 'LV afterload rises with every litre of flow.', 'Pulse pressure falls toward zero when the aortic valve stops opening.'] },

{ id: 'ecmo-lv-distension', t: 'ECMO and LV distension',
  lede: 'A very weak LV on high-flow V-A ECMO may stop opening its aortic valve. Blood still enters the LV (bronchial and Thebesian return, regurgitation, residual pulmonary flow), so it distends, LA pressure rises and the lungs flood.',
  preset: { LV_Ees: 0.45, LV_V0: 30, dV: 350, HR: 95, ecmo: 4.5 }, ctrls: ['ecmo', 'imp', 'asd', 'dobu', 'ne'], acts: ['vent', 'septo'],
  panels: [pvLV(), wL(), wR({ wide: true, h: 180 })],
  ro: ['ejT', 'SV', 'LVEDV', 'LVEDP', 'LAP', 'mPAP', 'MAP', 'PP', 'imp'],
  tries: [
    { l: 'Add Impella vent', set: { imp: 8 }, w: 'The Impella empties the LV directly: the loop collapses leftward and LA pressure falls (ECPELLA).' },
    { l: 'Atrial septostomy', set: { asd: 0.8 }, w: 'An atrial left-to-right shunt decompresses the LA, lowering pulmonary pressures, though the LV may stay large.' },
    { l: 'Inotrope', set: { dobu: 7.5 }, w: 'A stronger LV opens the aortic valve again and ejects.' },
    { l: 'Lower ECMO flow', set: { ecmo: 3 }, w: 'Less afterload lets the LV eject, at the cost of total support.' },
  ],
  keys: ['Warning signs: loss of pulsatility, closed aortic valve on echo, rising PCWP, pulmonary oedema.', 'Strategies: lower flow, inotropes, Impella, atrial septostomy, surgical vent.', 'LV stasis also risks thrombus.'] },

// ---------------- right heart and pericardium
{ id: 'pa-htn-rv-failure', t: 'Pulmonary hypertension and RV failure',
  lede: 'The RV is built for a low-pressure circuit. When PVR rises, the RV dilates, its EF falls and output drops. Volume loading can make things worse by dilating the RV further and raising CVP.',
  preset: { Rap: 0.45, RV_Ees: 0.75, HR: 88, dV: 150 }, ctrls: ['Rap', 'RV_Ees', 'dV', 'ino', 'rpump'],
  panels: [{ type: 'pv', ch: ['RV', 'LV'], title: 'RV and LV loops', espvr: true }, wR({ ymax: 80 }), wL({ wide: true, h: 170 })],
  ro: ['mPAP', 'PVR', 'RAP', 'RVEDV', 'RVEF', 'CO', 'MAP', 'LVEDV', 'RVEesEa'],
  tries: [
    { l: 'Inhaled pulmonary vasodilator', set: { ino: 1 }, w: 'PVR falls, the RV empties better, LV filling and output recover.' },
    { l: 'Fluid 500 mL', set: { dV: 650 }, w: 'CVP and RV volume rise sharply while output barely improves.' },
    { l: 'Adapted RV (Ees 1.5)', set: { RV_Ees: 1.5 }, w: 'Chronic hypertrophy couples the RV to its afterload: same PVR, much better output.' },
    { l: 'Impella RP (P8)', set: { rpump: 8 }, w: 'RA-to-PA support bypasses the RV, raising PA flow and LV preload.' },
  ],
  keys: ['RV–PA coupling (Ees/Ea) below about 0.7 signals failure.', 'Low LV preload (underfilled LV) is the route by which RV failure causes systemic shock.', 'Treat afterload (vasodilators), support contractility and perfusion, and be cautious with fluid.'] },

{ id: 'pericardial-constraints', t: 'Pericardial constraints',
  lede: 'The pericardium limits total heart volume. Fluid inside it (tamponade) or a rigid pericardium (constriction) raises the pressure around every chamber, equalising diastolic pressures and coupling the two ventricles.',
  preset: { resp: 1 }, ctrls: ['eff', 'periK', 'periV0', 'resp', 'dV'], acts: ['tap'],
  panels: [{ type: 'wave', title: 'Diastolic pressures and pericardial pressure (0–35 mmHg)', sig: ['LVP', 'RVP', 'LAP', 'RAP', 'Ppe'], ymax: 35, fixed: true, h: 280 }, { type: 'wave', title: 'Arterial pressure over two breaths', sig: ['AoP'], win: 9, ymax: 140 }, { type: 'pv', ch: ['LV', 'RV'], title: 'LV and RV loops' }],
  ro: ['Ppe', 'pulsus', 'BP', 'RAP', 'LAP', 'RVEDP', 'LVEDP', 'SV', 'CO'],
  tries: [
    { l: 'Effusion 200 mL', set: { eff: 200 }, w: 'Pericardial pressure rises and starts to track the diastolic pressures; stroke volume falls.' },
    { l: 'Tamponade 280 mL', set: { eff: 280 }, w: 'CVP, PCWP and pericardial pressure converge; arterial pressure falls with each inspiration (pulsus paradoxus > 10 mmHg).' },
    { l: 'Pericardiocentesis', act: 'tap', keep: true, w: 'Removing fluid restores filling within a few beats. Try it straight after the tamponade button.' },
    { l: 'Constriction', set: { eff: 0, periK: 0.08, periV0: 300, dV: 450 }, w: 'High, equal diastolic pressures without fluid: a rigid shell. Early filling is rapid, then stops abruptly.' },
  ],
  keys: ['Rate of accumulation matters more than volume: a stretched pericardium (higher reserve volume) tolerates large slow effusions.', 'Inspiration fills the RV at the LV\'s expense inside a fixed shell: pulsus paradoxus.', 'No compensatory tachycardia or venoconstriction is modelled, so filling pressures stay lower than in patients.'] },

{ id: 'right-ventricle', t: 'Right ventricle',
  lede: 'The RV has a low ESPVR slope and a compliant EDPVR. It handles volume well but tolerates pressure poorly, so it is far more afterload-sensitive than the LV.',
  ctrls: ['Rap', 'RV_Ees', 'Ras', 'dV'],
  panels: [{ type: 'pv', ch: ['RV', 'LV'], title: 'RV and LV loops on the same axes', espvr: true, edpvr: true }, wR()],
  ro: ['RVEDV', 'RVESV', 'RVEF', 'RVSP', 'mPAP', 'PVR', 'RAP', 'CO'],
  tries: [
    { l: 'Triple PVR', set: { Rap: 0.21 }, w: 'RV stroke volume falls noticeably and the RV enlarges.' },
    { l: 'Triple SVR instead', set: { Ras: 2.8 }, w: 'The LV keeps most of its stroke volume against a much larger relative afterload increase: the LV is the pressure pump.' },
    { l: 'Volume load', set: { dV: 700 }, w: 'The RV accepts the volume with a modest rise in RV EDP.' },
  ],
  keys: ['RV Ees ≈ 0.5–0.8 mmHg/mL vs LV ≈ 2–3.', 'The RV loop is trapezoidal with ejection continuing as pressure falls.', 'RV output depends on interventricular interaction and pulmonary afterload.'] },

{ id: 'atria', t: 'Atria',
  lede: 'The atrium is a reservoir in systole, a conduit in early diastole and a booster pump at end-diastole. Its pressure trace shows the a-wave (contraction) and the v-wave (filling against a closed mitral valve).',
  ctrls: ['LA_Ees', 'LA_k', 'rhythm', 'PRi', 'mv_r'],
  panels: [{ type: 'pv', ch: ['LA'], title: 'LA pressure–volume loop' }, { type: 'wave', title: 'LA and LV pressures (0–30 mmHg)', sig: ['LAP', 'LVP'], ymax: 30, fixed: true }, ecg()],
  ro: ['LAP', 'LAv', 'LAVmax', 'LVEDV', 'SV', 'EA', 'CO'],
  tries: [
    { l: 'Atrial fibrillation', set: { rhythm: 1 }, w: 'The a-wave and the active (A) limb of the LA loop disappear; EDV and SV fall.' },
    { l: 'Stiff LA', set: { LA_k: 0.11 }, w: 'v-waves grow and mean LA pressure rises: the reservoir is lost.' },
    { l: 'Add MR', set: { mv_r: 0.4 }, w: 'Systolic backflow inflates the v-wave and the reservoir limb.' },
    { l: 'Weak atrial kick', set: { LA_Ees: 0.1 }, w: 'Booster function falls; the late filling contribution shrinks.' },
  ],
  keys: ['The LA loop is a figure of eight: an A-loop (active) and a V-loop (passive).', 'Atrial kick contributes 15–30% of filling, more in stiff ventricles.', 'v-wave height reflects LA compliance and regurgitant volume.'] },

{ id: 'mitral-flow', t: 'Mitral inflow',
  lede: 'Doppler mitral inflow has an early (E) wave, driven by LV relaxation and LA pressure, and a late (A) wave from atrial contraction. Its pattern grades diastolic dysfunction.',
  ctrls: ['LV_tau', 'LV_k', 'dV', 'HR'],
  panels: [wF({ sig: ['Qmv'], title: 'Mitral inflow (mL/s)' }), { type: 'wave', title: 'LA and LV pressures (0–40 mmHg)', sig: ['LAP', 'LVP'], ymax: 40, fixed: true }],
  ro: ['Evel', 'Avel', 'EA', 'DT', 'LAP', 'LVEDP'],
  tries: [
    { l: 'Grade I: impaired relaxation', set: { LV_tau: 0.075 }, w: 'E falls, A rises (E/A < 0.8), deceleration time lengthens; LA pressure stays normal.' },
    { l: 'Grade II: pseudonormal', set: { LV_tau: 0.075, LV_k: 0.04, dV: 500 }, w: 'Raised LA pressure pushes E back up: the E/A ratio looks normal despite disease.' },
    { l: 'Grade III: restrictive', set: { LV_tau: 0.08, LV_k: 0.05, dV: 900 }, w: 'Tall E, tiny A (E/A > 2) and short deceleration time: very high LA pressure into a stiff ventricle.' },
  ],
  keys: ['E depends on the LA–LV gradient at mitral opening; A on atrial function and LV stiffness.', 'Pseudonormalisation is why E/A alone cannot grade diastolic function.', 'Short deceleration time (< 150 ms) signals a stiff LV and high filling pressure.'] },

{ id: 'aortic-flow', t: 'Aortic flow',
  lede: 'Aortic flow rises steeply after the aortic valve opens, peaks in early systole and decays as LV pressure falls. Its integral (VTI × LVOT area) is the stroke volume.',

function vqCalc() {

  const A = GAS.unit(vqA, PIO2, Cv, CvC, G.Hb, P50), B = GAS.unit(vqB, PIO2, Cv, CvC, G.Hb, P50);

}
function ventCalc() {

  const rows = [['ECG', 'II', '#46e07a'], ['AoP', 'ART', '#ff5a5a'], ['PAP', 'PA', '#ffd54a'], ['RAP', 'CVP', '#55b4ff'], ['PLETH', 'SpO₂', '#6ae6f2']];

    ['CVP', fmt(b.RAP), '#55b4ff', 'mmHg'],

  }
